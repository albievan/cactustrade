# golangci-lint v2 configuration — part of `make check` (CLAUDE.md §5). The standard set
# (errcheck, govet, ineffassign, staticcheck, unused) is on by default in v2.
version: "2"
run:
  timeout: 5m
  build-tags: [integration]

linters:
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: receiver-naming
        - name: indent-error-flow
    depguard:
      rules:
        # The dependency rule: domain ← app ← ports ← adapters ← cmd (docs/ARCHITECTURE.md).
        domain:
          files: ["**/internal/domain/**"]
          list-mode: lax
          deny:
            - { pkg: "github.com/albievan/cactustrade/internal/app", desc: "domain must not depend on app" }
            - { pkg: "github.com/albievan/cactustrade/internal/ports", desc: "domain must not depend on ports" }
            - { pkg: "github.com/albievan/cactustrade/internal/adapters", desc: "domain must not depend on adapters" }
            - { pkg: "database/sql", desc: "domain does no I/O" }
            - { pkg: "net/http", desc: "domain does no I/O" }
            - { pkg: "os", desc: "domain does no I/O" }
        app:
          files: ["**/internal/app/**", "**/internal/ports/**"]
          list-mode: lax
          deny:
            - { pkg: "github.com/albievan/cactustrade/internal/adapters", desc: "app and ports must not depend on adapters" }
            - { pkg: "database/sql", desc: "use ports, not the database" }
            - { pkg: "net/http", desc: "use ports, not HTTP" }
            - { pkg: "os", desc: "use ports, not the OS" }
        # The regime model and playbooks are pure functions of candles: no I/O, no ports, no
        # broker. Floats are allowed here (and only here and at the eToro JSON edge).
        strategy:
          files: ["**/internal/strategy/**"]
          list-mode: lax
          deny:
            - { pkg: "github.com/albievan/cactustrade/internal/app", desc: "strategy is pure" }
            - { pkg: "github.com/albievan/cactustrade/internal/ports", desc: "strategy is pure" }
            - { pkg: "github.com/albievan/cactustrade/internal/adapters", desc: "strategy never reaches the broker or the database" }
            - { pkg: "database/sql", desc: "strategy does no I/O" }
            - { pkg: "net/http", desc: "strategy does no I/O" }
            - { pkg: "os", desc: "strategy does no I/O" }
        # The LLM reviewer (phase 5) must never reach the broker (CLAUDE.md §2.5).
        reviewer:
          files: ["**/internal/adapters/llm/**"]
          list-mode: lax
          deny:
            - { pkg: "github.com/albievan/cactustrade/internal/adapters/etoro", desc: "the LLM never calls the broker" }
            - { pkg: "github.com/albievan/cactustrade/internal/adapters/trading212", desc: "the LLM never calls a broker" }
            - { pkg: "github.com/albievan/cactustrade/internal/adapters/secretstore", desc: "the LLM adapter gets its key injected, nothing more" }
        # The Trading 212 client is read-only and stands alone: it never reaches eToro.
        trading212:
          files: ["**/internal/adapters/trading212/**"]
          list-mode: lax
          deny:
            - { pkg: "github.com/albievan/cactustrade/internal/adapters/etoro", desc: "Trading 212 keys never go to eToro" }
            - { pkg: "github.com/albievan/cactustrade/internal/app", desc: "adapters depend on ports, not use cases" }
  exclusions:
    generated: lax
    presets: [comments, common-false-positives, legacy, std-error-handling]
    paths:
      - ".*\\.gen\\.go$"
    rules:
      # Test helpers may panic or use fixed paths.
      - path: _test\.go
        linters: [gosec, noctx]
      # The generated ServerInterface fixes these method names (ListApiKeys…).
      - path: internal/adapters/http/handlers\.go
        text: "var-naming"
        linters: [revive]
      # Reviewed: the operator names the master-key / secret files; our data folder otherwise.
      - path: (internal/adapters/secretstore/secretstore\.go|cmd/cactustrade/)
        text: "G30[4]|G70[34]"
        linters: [gosec]
      # Reviewed: "restart" re-executes our own binary (os.Executable) with our own arguments.
      - path: cmd/cactustrade/main\.go
        text: "G204|G702"
        linters: [gosec]
      # Reviewed: the only text concatenated into the events query is a list of "?" placeholders.
      - path: internal/adapters/sqlstore/market\.go
        text: "G202"
        linters: [gosec]
      # Reviewed: the HTTP->HTTPS redirect targets the client's own validated Host header.
      - path: cmd/cactustrade/demux\.go
        text: "G710"
        linters: [gosec]
      # Reviewed: the session cookie's Secure flag is CACTUSTRADE_COOKIE_SECURE (true by default).
      - path: internal/adapters/http/handlers\.go
        text: "G124"
        linters: [gosec]
      # Reviewed: these are credential NAMES and environment variable names, not values.
      - path: internal/domain/credentials\.go
        text: "G101"
        linters: [gosec]
      # Reviewed: the hash length is checked (1-64 bytes) just before the conversion.
      - path: internal/adapters/argon2/argon2\.go
        text: "G115"
        linters: [gosec]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
