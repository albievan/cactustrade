# oapi-codegen configuration: `make gen` writes internal/adapters/http/api.gen.go.
package: httpapi
output: internal/adapters/http/api.gen.go
generate:
  std-http-server: true
  models: true
  embedded-spec: false
output-options:
  prefer-skip-optional-pointer: false
  # The live stream's message schemas (LiveSnapshot …) are referenced only from the
  # text/event-stream description, so pruning would drop them (PLAN 6.8).
  skip-prune: true
