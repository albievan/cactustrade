openapi: 3.0.3
info:
  title: cactusTrade API
  version: 0.1.0
  description: |
    REST API of cactusTrade, an autonomous long-only share-trading agent for one eToro
    account (demo by default). Contract-first: handlers are generated from this file.

    **Authentication.** The web UI signs in with `POST /api/v1/auth/login`, which sets the
    `__Host-cactustrade_session` cookie (HttpOnly, Secure, SameSite=Strict, Path=/; named
    `cactustrade_session` only when Secure cookies are turned off for a plain-HTTP test);
    every state-changing request with that cookie must also send the session's CSRF token
    in `X-CSRF-Token`.
    Programs use an API key: `Authorization: Bearer ctk_<id>_<secret>` (no CSRF needed).

    **Limits.** Every `/api/` route is rate-limited per user or API key and per address:
    reads 600/min, other methods 60/min, CSV exports 10/min, live-stream connects 30/min.
    Over a limit the answer is 429 (problem+json) with `Retry-After`. Pause, stop and the
    kill switch are never rate-limited. A request body over 1 MiB (a JSON body over 64 KiB)
    is refused with 413.

    **Roles.** `viewer` reads; `operator` also starts, stops and pulls the kill switch;
    `admin` manages users, credentials, limits and the trading mode.

    **Secrets are write-only.** Credentials can be set or deleted but are never returned.

    cactusTrade is software, not financial advice; trading can lose money.
  license:
    name: Public domain (SQLite-style blessing)
servers:
  - url: /
tags:
  - name: system
  - name: auth
  - name: users
  - name: apikeys
  - name: credentials
  - name: accounts
  - name: broker
  - name: overview
  - name: market
  - name: events
  - name: risk
  - name: agent
  - name: research
  - name: llm
  - name: email
  - name: audit
  - name: history
  - name: live
  - name: statements
  - name: analysis
security:
  - sessionCookie: []
  - bearerApiKey: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness (the process is serving)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /readyz:
    get:
      tags: [system]
      operationId: readyz
      summary: Readiness (the database answers)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/Health" }
  /api/v1/public/status:
    get:
      tags: [system]
      operationId: getPublicStatus
      summary: What the sign-in page needs before anyone is signed in
      security: []
      responses:
        "200":
          description: Public status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicStatus" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in (sets the session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (clears the session cookie)
      security: []
      responses:
        "204": { description: Signed out }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user, permissions and CSRF token
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/public/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: E-mail a password-reset link to the user's address (same answer whether or not the user exists)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202": { description: If the user exists and has an e-mail address, a link is on its way }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/public/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Choose a new password with the link's token (ends every session of the user)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
      responses:
        "204": { description: Changed; sign in with the new password }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/me/profile:
    get:
      tags: [auth]
      operationId: getMyProfile
      summary: Your e-mail address and e-mail notification choices
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [auth]
      operationId: setMyProfile
      summary: Change your e-mail address and notification choices (web UI)
      description: >-
        Changing the e-mail address (where password-reset links go) needs the current password
        (PLAN 7.1.11); wrong passwords are rate-limited like sign-ins (429 with Retry-After).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/email:
    get:
      tags: [email]
      operationId: getEmailSetup
      summary: The outgoing mail server (admin; never the password)
      responses:
        "200":
          description: Setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSetup" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [email]
      operationId: setEmailSetup
      summary: Change the outgoing mail server (admin, web UI). password absent keeps the stored one, "" removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailSetupInput" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSetup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/email/test:
    post:
      tags: [email]
      operationId: sendTestEmail
      summary: Send a test e-mail now through the saved server (admin, web UI)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestEmailRequest" }
      responses:
        "204": { description: The server accepted the message }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/email/outbox:
    get:
      tags: [email]
      operationId: listOutbox
      summary: The newest e-mails, sent or waiting (admin)
      responses:
        "200":
          description: Mail
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OutboxMail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change your own password (ends your other sessions)
      description: Wrong current passwords are rate-limited like sign-ins (429 with Retry-After; PLAN 7.1.10).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed; sign in again }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Version, trading mode and agent state (viewer)
      description: "A user who must still change the default password gets only the real-trading banner's facts (realArmed, realArmedUnknown); version, build, start time and account are left empty."
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/system/health:
    get:
      tags: [system]
      operationId: getSystemHealth
      summary: Trading health (admin) — 503 when a loop is not alive
      description: >
        Every trading loop is alive: the supervisor loop ticked and every account it covers
        (an eToro demo account with keys) had a supervisor pass within the last 60 seconds,
        and the agent loop runs. Answers 503 with the same body, naming the account, when
        not. The accounts the caller can see carry their names; the others only their ids.
      responses:
        "200":
          description: Every loop is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemHealth" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503":
          description: A loop is not alive (problems name the account)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemHealth" }
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (admin)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Change a user's role, enabled state or password (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user, their sessions and API keys (admin)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/api-keys:
    get:
      tags: [apikeys]
      operationId: listApiKeys
      summary: List your API keys (admins see all)
      responses:
        "200":
          description: API keys (never their secrets)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [apikeys]
      operationId: createApiKey
      summary: Create an API key (signed-in users only; role ≤ yours)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Created — the secret is shown this once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiKey" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/api-keys/{keyId}:
    parameters:
      - { name: keyId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    delete:
      tags: [apikeys]
      operationId: revokeApiKey
      summary: Revoke an API key (yours; admins any)
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/credentials:
    get:
      tags: [credentials]
      operationId: listCredentials
      summary: Which deployment credentials are set (never their values)
      description: >-
        Read-only status. eToro keys are set per account (PUT /api/v1/accounts/{accountId}/keys, owner,
        web UI); the deployment's demo pair comes from ETORO_DEMO_PUB / ETORO_DEMO_PK (PLAN 7.1.3).
      responses:
        "200":
          description: Credential status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: The eToro accounts you own or were given, with your access
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Add an eToro account you own (operator or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/current:
    put:
      tags: [accounts]
      operationId: setCurrentAccount
      summary: Switch the account you are working on
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRef" }
      responses:
        "200":
          description: Now current
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    patch:
      tags: [accounts]
      operationId: renameAccount
      summary: Rename an account (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameAccountRequest" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [accounts]
      operationId: deleteAccount
      summary: Delete an account, its keys, shares and watchlist (owner, web UI)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/keys:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    get:
      tags: [accounts]
      operationId: getAccountKeys
      summary: Whether the account's keys are set (never their values)
      responses:
        "200":
          description: Key status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountKeys" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [accounts]
      operationId: setAccountKeys
      summary: Store the account's credentials, write-only (owner, web UI); an empty value keeps the stored one
      description: |
        `values` sets any credential by its key (see `GET /api/v1/platforms` for each platform's
        keys); a key the platform does not have, or one only its sign-in sets (Saxo's
        `refresh_token`), is refused and nothing is stored.
        The older fields set the platform's first two credentials. eToro: `apiKey` is the Public
        API Key (x-api-key), `userKey` the User Key (x-user-key). Trading 212: API key and API
        secret. Saxo: app key and app secret. Tiger: Tiger ID and account number.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAccountKeysRequest" }
      responses:
        "204": { description: Stored (encrypted) }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/test:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    post:
      tags: [accounts]
      operationId: testAccount
      summary: Test the account's eToro connection (owner; one read-only call)
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerCheck" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/shares:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    get:
      tags: [accounts]
      operationId: listAccountShares
      summary: Who the account is shared with (owner)
      responses:
        "200":
          description: Shares
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountShare" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [accounts]
      operationId: shareAccount
      summary: Give a user view or trade access (owner, web UI)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareAccountRequest" }
      responses:
        "204": { description: Shared }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/shares/{userId}:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      - { name: userId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    delete:
      tags: [accounts]
      operationId: unshareAccount
      summary: Remove a user's access (owner, web UI)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/saxo/connect:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    get:
      tags: [accounts]
      operationId: connectSaxoAccount
      summary: Start connecting a Saxo account — returns Saxo's sign-in address (owner, web UI)
      description: |
        Issues a random, single-use `state` (kept only as a hash, valid 10 minutes, bound to you
        and the account) and returns Saxo's authorize address (SIM for a demo account, LIVE for
        a real one) with the account's app key. Needs `CACTUSTRADE_PUBLIC_URL`: the redirect
        address to register in the Saxo developer portal is that URL followed by
        `/api/v1/oauth/saxo/callback`. Nothing is sent to Saxo until the browser goes there.
      responses:
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectStart" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/real-gate:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    get:
      tags: [accounts]
      operationId: getRealGate
      summary: The real-trading gate of a real-money account, its checklist and the demo evidence (view access)
      description: |
        The checklist the server applies when arming (PLAN 7.10), without the typed phrase:
        the real account (eToro, real, keys, reconciled, not killed, agent stopped, limits within
        the real-money ceilings), the linked demo account (same owner), the demo evidence (20
        qualifying risk days in the last 60, the latest at most 7 days old) and the arming user
        (an admin who owns the account, in a web session). `enabled` is false in this build:
        arming is always refused until the owner's written consent (PLAN 7.18).
      parameters:
        - { name: demoAccountId, in: query, required: false, schema: { type: string, maxLength: 64 }, description: "the demo account the checklist is for (default: the one last armed with, else the owner's first)" }
      responses:
        "200":
          description: The gate and its checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealGateStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/real-gate/arm:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    post:
      tags: [accounts]
      operationId: armRealGate
      summary: Ask to arm real trading (admin who owns the account, web session only, password and phrase) — refused in this build
      description: |
        Checks, in order: the mode.switch permission (admin), a web session (never an API key),
        ownership of the account, the caller's password (counted like a sign-in: a wrong one
        is 403, too many attempts 429), the phrase `ENABLE REAL TRADING <account name>` (422
        when wrong), then the checklist (409 naming the failing checks). With every check
        passing this build answers 403 "Real trading is not enabled in this build": real
        trading needs the owner's written consent (PLAN 7.18). Nothing is ever stored as
        armed. Every refusal after the password is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArmRealRequest" }
      responses:
        "200":
          description: Armed (never in this build)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealGate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/real-gate/disarm:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    post:
      tags: [accounts]
      operationId: disarmRealGate
      summary: Disarm real trading now (trade access and agent.kill; web session or API key; never rate limited)
      description: |
        Idempotent: a gate that is not armed stays locked (200). A running or paused agent is
        stopped (no new entries); nothing is cancelled or closed, so exits continue. Audited,
        with a danger event and an e-mail to the admins and the owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisarmRealRequest" }
      responses:
        "200":
          description: The gate afterwards (locked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealGate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/oauth/saxo/callback:
    get:
      tags: [accounts]
      operationId: saxoCallback
      summary: Saxo sends the browser back here after sign-in (public; redirects to /accounts)
      description: |
        Checks the `state` (ours, unused, under 10 minutes old, for an account its user still
        owns; it is used up whatever happens), exchanges the `code` for tokens and stores the
        refresh token encrypted. Always answers with a redirect to `/accounts`: with
        `?connected=<accountId>` on success, else `?connect_error=expired|refused|failed`.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 2048 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 256 } }
      responses:
        "303":
          description: Back to the accounts page
          headers:
            Location: { schema: { type: string } }
  /api/v1/platforms:
    get:
      tags: [accounts]
      operationId: listPlatforms
      summary: The platforms an account can be on and the credentials each needs (never values)
      responses:
        "200":
          description: Platforms, eToro first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformInfo" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/overview:
    get:
      tags: [overview]
      operationId: getOverview
      summary: Every account you can view, on every platform — cash, equity, positions (viewer)
      description: |
        Reads each account now (eToro, and the view-only Trading 212, Saxo and Tiger Brokers).
        An account that cannot be read carries its `error` (`noKeys` when its keys are not set
        yet, `reconnect` when its platform sign-in has lapsed) instead of failing the call.
        Totals are per currency: amounts in different currencies are never added up.
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/overview/history:
    get:
      tags: [overview]
      operationId: getEquityHistory
      summary: Equity over time of every account you can view (snapshots every 15 minutes, kept 400 days)
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 400, default: 30 } }
      responses:
