    post:
      tags: [research]
      operationId: acceptResearchProposal
      summary: >-
        Put a research proposal on the watchlist through eToro's eligibility check (trade access). A share eToro
        refuses is dropped with the reason (400); when eToro cannot be asked the proposal stays.
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchAddedShare" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/llm/research:
    get:
      tags: [llm]
      operationId: getResearchSettings
      summary: Web research settings (R29) - the LLM profile, shares per run, runs per day (viewer)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchSetup" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [llm]
      operationId: setResearchSettings
      summary: Store the web research settings (admin, web UI). The profile's provider must have a built-in web search.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchConfig" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchSetup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/llm:
    get:
