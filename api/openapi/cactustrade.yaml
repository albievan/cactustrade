openapi: 3.0.3
info:
  title: cactusTrade API
  version: 0.1.0
  description: |
    REST API of cactusTrade, an autonomous long-only share-trading agent for one eToro
    account (demo by default). Contract-first: handlers are generated from this file.

    **Authentication.** The web UI signs in with `POST /api/v1/auth/login`, which sets the
    `cactustrade_session` cookie (HttpOnly, Secure, SameSite=Strict); every state-changing
    request with that cookie must also send the session's CSRF token in `X-CSRF-Token`.
    Programs use an API key: `Authorization: Bearer ctk_<id>_<secret>` (no CSRF needed).

    **Roles.** `viewer` reads; `operator` also starts, stops and pulls the kill switch;
    `admin` manages users, credentials, limits and the trading mode.

    **Secrets are write-only.** Credentials can be set or deleted but are never returned.

    cactusTrade is software, not financial advice; trading can lose money.
  license:
    name: Public domain (SQLite-style blessing)
servers:
  - url: /
tags:
  - name: system
  - name: auth
  - name: users
  - name: apikeys
  - name: credentials
  - name: accounts
  - name: broker
  - name: overview
  - name: market
  - name: events
  - name: risk
  - name: research
  - name: llm
  - name: email
  - name: audit
security:
  - sessionCookie: []
  - bearerApiKey: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness (the process is serving)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /readyz:
    get:
      tags: [system]
      operationId: readyz
      summary: Readiness (the database answers)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/Health" }
  /api/v1/public/status:
    get:
      tags: [system]
      operationId: getPublicStatus
      summary: What the sign-in page needs before anyone is signed in
      security: []
      responses:
        "200":
          description: Public status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicStatus" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in (sets the session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (clears the session cookie)
      security: []
      responses:
        "204": { description: Signed out }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user, permissions and CSRF token
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/public/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: E-mail a password-reset link to the user's address (same answer whether or not the user exists)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202": { description: If the user exists and has an e-mail address, a link is on its way }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/public/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Choose a new password with the link's token (ends every session of the user)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
      responses:
        "204": { description: Changed; sign in with the new password }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/me/profile:
    get:
      tags: [auth]
      operationId: getMyProfile
      summary: Your e-mail address and e-mail notification choices
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [auth]
      operationId: setMyProfile
      summary: Change your e-mail address and notification choices (web UI)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/email:
    get:
      tags: [email]
      operationId: getEmailSetup
      summary: The outgoing mail server (admin; never the password)
      responses:
        "200":
          description: Setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSetup" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [email]
      operationId: setEmailSetup
      summary: Change the outgoing mail server (admin, web UI). password absent keeps the stored one, "" removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailSetupInput" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSetup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/email/test:
    post:
      tags: [email]
      operationId: sendTestEmail
      summary: Send a test e-mail now through the saved server (admin, web UI)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestEmailRequest" }
      responses:
        "204": { description: The server accepted the message }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/email/outbox:
    get:
      tags: [email]
      operationId: listOutbox
      summary: The newest e-mails, sent or waiting (admin)
      responses:
        "200":
          description: Mail
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OutboxMail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change your own password (ends your other sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed; sign in again }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Version, trading mode and agent state (viewer)
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (admin)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Change a user's role, enabled state or password (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user, their sessions and API keys (admin)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/api-keys:
    get:
      tags: [apikeys]
      operationId: listApiKeys
      summary: List your API keys (admins see all)
      responses:
        "200":
          description: API keys (never their secrets)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [apikeys]
      operationId: createApiKey
      summary: Create an API key (signed-in users only; role ≤ yours)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Created — the secret is shown this once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiKey" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/api-keys/{keyId}:
    parameters:
      - { name: keyId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    delete:
      tags: [apikeys]
      operationId: revokeApiKey
      summary: Revoke an API key (yours; admins any)
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/credentials:
    get:
      tags: [credentials]
      operationId: listCredentials
      summary: Which credentials are set (never their values)
      responses:
        "200":
          description: Credential status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/credentials/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { $ref: "#/components/schemas/CredentialName" } }
    put:
      tags: [credentials]
      operationId: setCredential
      summary: Set a credential (admin, web UI session only); write-only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetCredentialRequest" }
      responses:
        "204": { description: Stored (encrypted) }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [credentials]
      operationId: deleteCredential
      summary: Delete a credential (admin, web UI session only)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: The eToro accounts you own or were given, with your access
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Add an eToro account you own (operator or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/current:
    put:
      tags: [accounts]
      operationId: setCurrentAccount
      summary: Switch the account you are working on
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRef" }
      responses:
        "200":
          description: Now current
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    patch:
      tags: [accounts]
      operationId: renameAccount
      summary: Rename an account (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameAccountRequest" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [accounts]
      operationId: deleteAccount
      summary: Delete an account, its keys, shares and watchlist (owner, web UI)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/keys:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    get:
      tags: [accounts]
      operationId: getAccountKeys
      summary: Whether the account's keys are set (never their values)
      responses:
        "200":
          description: Key status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountKeys" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [accounts]
      operationId: setAccountKeys
      summary: Store the account's key pair, write-only (owner, web UI); an empty value keeps the stored one
      description: |
        eToro: `apiKey` is the Public API Key (x-api-key), `userKey` the User Key (x-user-key).
        Trading 212: `apiKey` is the API key, `userKey` the API secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAccountKeysRequest" }
      responses:
        "204": { description: Stored (encrypted) }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/test:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    post:
      tags: [accounts]
      operationId: testAccount
      summary: Test the account's eToro connection (owner; one read-only call)
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerCheck" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/shares:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    get:
      tags: [accounts]
      operationId: listAccountShares
      summary: Who the account is shared with (owner)
      responses:
        "200":
          description: Shares
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountShare" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [accounts]
      operationId: shareAccount
      summary: Give a user view or trade access (owner, web UI)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareAccountRequest" }
      responses:
        "204": { description: Shared }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/accounts/{accountId}/shares/{userId}:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      - { name: userId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    delete:
      tags: [accounts]
      operationId: unshareAccount
      summary: Remove a user's access (owner, web UI)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/overview:
    get:
      tags: [overview]
      operationId: getOverview
      summary: Every account you can view, on every platform — cash, equity, positions (viewer)
      description: |
        Reads each account now (eToro and Trading 212). An account that cannot be read carries
        its `error` (and `noKeys` when its keys are not set yet) instead of failing the call.
        Totals are per currency: amounts in different currencies are never added up.
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/overview/history:
    get:
      tags: [overview]
      operationId: getEquityHistory
      summary: Equity over time of every account you can view (snapshots every 15 minutes, kept 400 days)
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 400, default: 30 } }
      responses:
        "200":
          description: One series per account that has snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EquitySeries" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/broker/test:
    post:
      tags: [broker]
      operationId: testBrokerConnection
      summary: Test the eToro connection with the current mode's keys (admin; one read-only call)
      description: |
        Calls eToro's portfolio endpoint once. An eToro failure is reported in the body
        (`ok: false`, `error`), not as an HTTP error.
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerCheck" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/broker/portfolio:
    get:
      tags: [broker]
      operationId: getPortfolio
      summary: The eToro account now — cash, positions, pending orders (viewer)
      responses:
        "200":
          description: Portfolio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/market/status:
    get:
      tags: [market]
      operationId: getMarketStatus
      summary: Today's sessions for LSE, NYSE/NASDAQ and ASX (viewer)
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketSession" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/instruments/search:
    get:
      tags: [market]
      operationId: searchInstruments
      summary: Search eToro instruments by name or symbol (admin)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        "200":
          description: Up to 20 matches; `market` is empty for anything cactusTrade cannot trade
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist:
    get:
      tags: [market]
      operationId: listWatchlist
      summary: The instruments the agent may trade (viewer)
      responses:
        "200":
          description: Watchlist, by symbol
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WatchItem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [market]
      operationId: addToWatchlist
      summary: Add a share after eToro confirms it can be bought as a real share at leverage 1 (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddWatchRequest" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchItem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist/quotes:
    get:
      tags: [market]
      operationId: listWatchlistQuotes
      summary: Current bid/ask of the watchlist (viewer)
      responses:
        "200":
          description: Quotes (instruments without a price are left out)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Quote" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist/{instrumentId}:
    parameters:
      - { name: instrumentId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    delete:
      tags: [market]
      operationId: removeFromWatchlist
      summary: Remove an instrument (admin)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/system/reload:
    post:
      tags: [system]
      operationId: reloadSettings
      summary: Re-read credentials from the environment and secret files (admin, web UI)
      responses:
        "204": { description: Reloaded }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/system/restart:
    post:
      tags: [system]
      operationId: restartServer
      summary: Restart cactusTrade gracefully (admin, web UI)
      responses:
        "202": { description: Restarting; the page reconnects when it is back }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: The newest events and the caller's unread count (viewer)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventFeed" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/events/seen:
    post:
      tags: [events]
      operationId: markEventsSeen
      summary: Mark every event as seen by the caller
      responses:
        "204": { description: Marked }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/risk/limits:
    get:
      tags: [risk]
      operationId: getRiskLimits
      summary: The risk limits (viewer)
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskLimits" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [risk]
      operationId: setRiskLimits
      summary: Change the risk limits (admin, web UI, only while the agent is stopped)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskLimits" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskLimits" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/themes:
    get:
      tags: [research]
      operationId: listThemes
      summary: The current account's themes (view)
      responses:
        "200":
          description: Themes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Theme" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [research]
      operationId: createTheme
      summary: Add a theme such as Space or Semiconductors (trade access)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Theme" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/themes/{themeId}:
    parameters:
      - { name: themeId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    put:
      tags: [research]
      operationId: updateTheme
      summary: Change a theme (trade access)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemeInput" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Theme" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [research]
      operationId: deleteTheme
      summary: Remove a theme (trade access)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/industries:
    get:
      tags: [research]
      operationId: listIndustries
      summary: eToro's stock industries (view)
      responses:
        "200":
          description: Industries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Industry" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/reviews:
    get:
      tags: [research]
      operationId: listReviews
      summary: The stocks the scanner reviewed for the current account, the rules applied and the outcome (view)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewBoard" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/scanner:
    put:
      tags: [research]
      operationId: setScanner
      summary: Switch the scanner on or off for the current account (trade access)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScannerSwitch" }
      responses:
        "204": { description: Stored }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/scanner/run:
    post:
      tags: [research]
      operationId: runScanner
      summary: Review the current account's themes and watchlist now (trade access; read-only on eToro)
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/llm:
    get:
      tags: [llm]
      operationId: getLlmSetup
      summary: The LLM reviewer's profiles, the active one and the providers to choose from (viewer; never a key)
      responses:
        "200":
          description: Setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmSetup" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [llm]
      operationId: setLlmSettings
      summary: Switch reviewing on or off and choose the active profile (admin, web UI)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmSettings" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmSetup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/llm/profiles:
    post:
      tags: [llm]
      operationId: createLlmProfile
      summary: Add a reviewer profile (admin, web UI)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmProfileInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/llm/profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    put:
      tags: [llm]
      operationId: updateLlmProfile
      summary: Change a reviewer profile (admin, web UI). apiKey absent keeps the stored key, "" removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmProfileInput" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [llm]
      operationId: deleteLlmProfile
      summary: Delete a reviewer profile and its key (admin, web UI); deleting the active one switches reviewing off
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/llm/profiles/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    post:
      tags: [llm]
      operationId: testLlmProfile
      summary: Ask a profile about a made-up trade (admin; nothing is traded)
      responses:
        "200":
          description: Result (a provider failure is ok=false with the reason)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmTestResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/llm/models:
    post:
      tags: [llm]
      operationId: listLlmModels
      summary: List the models a provider offers, with the key typed in or a profile's stored key (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmModelsRequest" }
      responses:
        "200":
          description: Model ids
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Newest audit entries (admin)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cactustrade_session
    bearerApiKey:
      type: http
      scheme: bearer
      description: "API key: ctk_<id>_<secret>"
  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Health:
      description: Health
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Health" }
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        field: { type: string, description: The invalid field, for 400s }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        detail: { type: string }
    Role:
      type: string
      enum: [admin, operator, viewer]
    TradingMode:
      type: string
      enum: [demo, real]
    AgentState:
      type: string
      enum: [stopped, running, paused, killed]
    PublicStatus:
      type: object
      required: [version, passwordResetAvailable]
      properties:
        version: { type: string }
        passwordResetAvailable: { type: boolean, description: "\"Forgot password\" works (mail server and public address set)" }
    PasswordResetRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, maxLength: 64 }
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string, maxLength: 256 }
        password: { type: string, maxLength: 512 }
    NotifyPrefs:
      type: object
      required: [trades, watchlist, alerts]
      properties:
        trades: { type: boolean, description: "orders, fills and closes (buy, sell, short)" }
        watchlist: { type: boolean, description: "shares added to or removed from a watchlist" }
        alerts: { type: boolean, description: "warnings and errors: kill switch, limits, failures" }
    Profile:
      type: object
      required: [email, notify]
      properties:
        email: { type: string, maxLength: 254, description: "empty = no e-mail" }
        notify: { $ref: "#/components/schemas/NotifyPrefs" }
    SmtpPreset:
      type: object
      required: [id, label, host, port, tls]
      properties:
        id: { type: string }
        label: { type: string }
        host: { type: string }
        port: { type: integer }
        tls: { type: string }
    EmailSetupInput:
      type: object
      required: [enabled, host, port, username, from, tls]
      properties:
        enabled: { type: boolean, description: "use this server for all e-mail" }
        host: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 0, maximum: 65535 }
        username: { type: string, maxLength: 254 }
        from: { type: string, maxLength: 320, description: "Send as: Name <address>; empty = the user name" }
        tls: { type: string, enum: [starttls, tls, none] }
        password: { type: string, maxLength: 1024, description: "write-only; absent = keep, empty = remove" }
    EmailSetup:
      type: object
      required: [enabled, host, port, username, from, tls, passwordSet, warnings, fallback, presets]
      properties:
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        from: { type: string }
        tls: { type: string }
        passwordSet: { type: boolean }
        warnings: { type: array, items: { type: string } }
        fallback: { type: string, description: "the deployment's server, used while this one is off (empty = none)" }
        presets: { type: array, items: { $ref: "#/components/schemas/SmtpPreset" } }
    TestEmailRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, maxLength: 254 }
    OutboxMail:
      type: object
      required: [id, to, subject, createdAt, attempts, lastError]
      properties:
        id: { type: string }
        to: { type: string }
        subject: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
        attempts: { type: integer }
        lastError: { type: string }
    SystemStatus:
      type: object
      required: [version, build, mode, agentState, database, startedAt, now]
      properties:
        version: { type: string }
        build: { type: string }
        mode: { $ref: "#/components/schemas/TradingMode" }
        agentState: { $ref: "#/components/schemas/AgentState" }
        database: { type: string, enum: [sqlite, mariadb] }
        startedAt: { type: string, format: date-time }
        now: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/Account" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 256 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 256 }
        newPassword: { type: string, maxLength: 256 }
    User:
      type: object
      required: [id, username, role, disabled, mustChangePassword, createdAt, updatedAt]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        mustChangePassword:
          type: boolean
          description: |
            The account still has the default password (the built-in admin/admin). Until it
            is changed, every endpoint except /auth/me, /auth/password and /auth/logout
            answers 403 with the title "Password change required".
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Me:
      type: object
      required: [user, permissions, via]
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions:
          type: array
          items: { type: string }
        via: { type: string, enum: [session, apikey] }
        csrfToken:
          type: string
          description: Send as X-CSRF-Token on state-changing requests (session only)
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 256 }
        role: { $ref: "#/components/schemas/Role" }
    UpdateUserRequest:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        password: { type: string, maxLength: 256 }
    ApiKey:
      type: object
      required: [id, ownerId, name, role, createdAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    CreateApiKeyRequest:
      type: object
      required: [name, role]
      properties:
        name: { type: string, maxLength: 64 }
        role: { $ref: "#/components/schemas/Role" }
        expiresInDays: { type: integer, minimum: 0, maximum: 365, description: 0 = never }
    CreatedApiKey:
      type: object
      required: [apiKey, secret]
      properties:
        apiKey: { $ref: "#/components/schemas/ApiKey" }
        secret: { type: string, description: "Bearer value; shown once, never again" }
    CredentialName:
      type: string
      enum: [etoro_demo_api_key, etoro_demo_user_key, etoro_real_api_key, etoro_real_user_key]
    Credential:
      type: object
      required: [name, label, set]
      properties:
        name: { $ref: "#/components/schemas/CredentialName" }
        label: { type: string }
        set: { type: boolean }
        source: { type: string, enum: [ui, env], description: "env = from an environment variable; read-only here" }
        envVar: { type: string, description: The environment variable that may provide it }
        updatedAt: { type: string, format: date-time }
    SetCredentialRequest:
      type: object
      required: [value]
      properties:
        value: { type: string, maxLength: 4096, description: "Write-only: never returned" }
    Cents:
      type: integer
      format: int64
      description: US dollars in cents (the eToro account currency is USD)
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'
      description: An exact decimal (prices and units, up to 6 places)
    Market:
      type: string
      enum: ["", LSE, NYSE, ASX]
      description: LSE, NYSE (NYSE and NASDAQ share a calendar), ASX or "" when not tradable here
    BrokerCheck:
      type: object
      required: [mode, ok, latencyMs, checkedAt, configuredKeys]
      properties:
        mode: { $ref: "#/components/schemas/TradingMode" }
        ok: { type: boolean }
        error: { type: string }
        configuredKeys: { type: boolean, description: false when the mode's key pair is not set }
        latencyMs: { type: integer, format: int64 }
        availableCashCents: { $ref: "#/components/schemas/Cents" }
        equityCents: { $ref: "#/components/schemas/Cents" }
        positions: { type: integer }
        nonConforming: { type: integer, description: positions that are not real shares, long, leverage 1 }
        checkedAt: { type: string, format: date-time }
    Position:
      type: object
      required: [positionId, instrumentId, openedAt, openRate, units, amountCents, unrealisedPnlCents, realAsset, long, leverage]
      properties:
        positionId: { type: integer, format: int64 }
        instrumentId: { type: integer, format: int64 }
        openedAt: { type: string, format: date-time }
        openRate: { $ref: "#/components/schemas/Decimal" }
        units: { $ref: "#/components/schemas/Decimal" }
        amountCents: { $ref: "#/components/schemas/Cents" }
        unrealisedPnlCents: { $ref: "#/components/schemas/Cents" }
        stopLossRate: { $ref: "#/components/schemas/Decimal" }
        takeProfitRate: { $ref: "#/components/schemas/Decimal" }
        realAsset: { type: boolean }
        long: { type: boolean }
        leverage: { type: integer }
    Portfolio:
      type: object
      required: [mode, availableCashCents, pendingOpenCents, equityCents, positions, asOf]
      properties:
        mode: { $ref: "#/components/schemas/TradingMode" }
        availableCashCents: { $ref: "#/components/schemas/Cents" }
        pendingOpenCents: { $ref: "#/components/schemas/Cents" }
        equityCents: { $ref: "#/components/schemas/Cents" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        asOf: { type: string, format: date-time }
    MarketSession:
      type: object
      required: [market, trading, open]
      properties:
        market: { $ref: "#/components/schemas/Market" }
        trading: { type: boolean, description: the market trades today (its local date) }
        open: { type: boolean, description: in its trading session right now }
        opens: { type: string, format: date-time }
        closes: { type: string, format: date-time }
        note: { type: string }
    Instrument:
      type: object
      required: [instrumentId, symbol, name, type, market]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        name: { type: string }
        type: { type: string }
        exchangeId: { type: integer, format: int64 }
        market: { $ref: "#/components/schemas/Market" }
    Eligibility:
      type: object
      required: [realLong]
      properties:
        realLong: { type: boolean, description: can be bought as a real share, long, leverage 1 }
        reason: { type: string }
        minPositionCents: { $ref: "#/components/schemas/Cents" }
        checkedAt: { type: string, format: date-time }
    WatchItem:
      type: object
      required: [instrument, eligibility, addedBy, addedAt]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        eligibility: { $ref: "#/components/schemas/Eligibility" }
        addedBy: { type: string }
        addedAt: { type: string, format: date-time }
    AddWatchRequest:
      type: object
      required: [instrumentId]
      properties:
        instrumentId: { type: integer, format: int64, minimum: 1 }
    Quote:
      type: object
      required: [instrumentId, bid, ask, at, delayed]
      properties:
        instrumentId: { type: integer, format: int64 }
        bid: { $ref: "#/components/schemas/Decimal" }
        ask: { $ref: "#/components/schemas/Decimal" }
        at: { type: string, format: date-time }
        delayed: { type: boolean }
    Event:
      type: object
      required: [id, at, kind, severity, title, actor]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string }
        severity: { type: string, enum: [info, success, warning, danger] }
        title: { type: string }
        detail: { type: string }
        actor: { type: string }
    EventFeed:
      type: object
      required: [events, unread]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        unread: { type: integer }
    RiskLimits:
      type: object
      required: [tradingBudgetCents, dailyLossBp, drawdownBp, maxPositionBp, maxOpenPositions, noEntryBeforeCloseMinutes, flattenBeforeCloseMinutes, maxPortfolioAgeSeconds, maxQuoteAgeSeconds, maxShortBp]
      properties:
        tradingBudgetCents: { $ref: "#/components/schemas/Cents" }
        dailyLossBp: { type: integer, description: "stop new entries at this loss from the start-of-day equity (bp; 200 = 2 %)" }
        drawdownBp: { type: integer, description: "kill switch at this fall from the high-water mark (bp)" }
        maxPositionBp: { type: integer, description: "largest position as a share of equity (bp; 0 = off)" }
        maxOpenPositions: { type: integer }
        noEntryBeforeCloseMinutes: { type: integer }
        flattenBeforeCloseMinutes: { type: integer }
        maxPortfolioAgeSeconds: { type: integer }
        maxQuoteAgeSeconds: { type: integer }
        maxShortBp: { type: integer, description: "all short exposure as a share of the trading budget (bp; 0 = no shorts; at most 2500 = 25 %)" }
    LlmProvider:
      type: object
      required: [id, label, defaultBaseUrl, keyRequired, note]
      properties:
        id: { type: string }
        label: { type: string }
        defaultBaseUrl: { type: string }
        keyRequired: { type: boolean }
        note: { type: string }
    LlmProfile:
      type: object
      required: [id, name, provider, model, baseUrl, timeoutSeconds, keySet]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        model: { type: string, description: "empty = the provider's default (Anthropic: claude-opus-5-5)" }
        baseUrl: { type: string, description: "empty = the provider's address" }
        timeoutSeconds: { type: integer }
        keySet: { type: boolean }
    LlmProfileInput:
      type: object
      required: [name, provider, model, baseUrl, timeoutSeconds]
      properties:
        name: { type: string, maxLength: 80, description: "empty = provider and model" }
        provider: { type: string, maxLength: 32 }
        model: { type: string, maxLength: 200 }
        baseUrl: { type: string, maxLength: 500 }
        timeoutSeconds: { type: integer, minimum: 0, maximum: 600 }
        apiKey: { type: string, maxLength: 4096, description: "write-only; absent = keep the stored key, empty = remove it" }
    LlmSettings:
      type: object
      required: [enabled, activeProfileId]
      properties:
        enabled: { type: boolean, description: "review every proposed trade (any reviewer failure rejects the trade)" }
        activeProfileId: { type: string, maxLength: 64, description: "the profile reviews use (empty = none)" }
    LlmModelsRequest:
      type: object
      required: [provider, baseUrl]
      properties:
        provider: { type: string, maxLength: 32 }
        baseUrl: { type: string, maxLength: 500 }
        apiKey: { type: string, maxLength: 4096, description: "the key typed on the page; absent = the stored key of profileId" }
        profileId: { type: string, maxLength: 64 }
    LlmSetup:
      type: object
      required: [settings, profiles, providers, defaultAnthropicModel]
      properties:
        settings: { $ref: "#/components/schemas/LlmSettings" }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/LlmProfile" }
        defaultAnthropicModel: { type: string }
        providers:
          type: array
          items: { $ref: "#/components/schemas/LlmProvider" }
    LlmTestResult:
      type: object
      required: [ok, latencyMs]
      properties:
        ok: { type: boolean }
        verdict: { type: string, enum: [approve, reduce, reject] }
        sizeMultiplier: { type: number }
        reason: { type: string }
        error: { type: string }
        latencyMs: { type: integer, format: int64 }
    Platform:
      type: string
      enum: [etoro, trading212]
      description: eToro (traded) or Trading 212 (view-only for now)
    Account:
      type: object
      required: [id, name, ownerId, ownerName, mode, platform, envKeys, access, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        mode: { $ref: "#/components/schemas/TradingMode" }
        platform: { $ref: "#/components/schemas/Platform" }
        envKeys: { type: boolean, description: "uses the deployment's ETORO_DEMO_PUB / _PK" }
        access: { type: string, enum: [view, trade, owner] }
        createdAt: { type: string, format: date-time }
    CreateAccountRequest:
      type: object
      required: [name, mode]
      properties:
        name: { type: string, maxLength: 60 }
        mode: { $ref: "#/components/schemas/TradingMode" }
        platform: { $ref: "#/components/schemas/Platform" }
    RenameAccountRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
    AccountRef:
      type: object
      required: [accountId]
      properties:
        accountId: { type: string, maxLength: 64 }
    AccountKeys:
      type: object
      required: [apiKeySet, userKeySet, fromEnvironment]
      properties:
        apiKeySet: { type: boolean }
        userKeySet: { type: boolean }
        fromEnvironment: { type: boolean }
    SetAccountKeysRequest:
      type: object
      required: [apiKey, userKey]
      properties:
        apiKey: { type: string, maxLength: 4096, description: "eToro Public API Key (x-api-key) or Trading 212 API key; empty = keep" }
        userKey: { type: string, maxLength: 4096, description: "eToro User Key (x-user-key) or Trading 212 API secret; empty = keep" }
    MinorUnits:
      type: integer
      format: int64
      description: An amount in hundredths of the currency given next to it (USD cents, GBP pence…)
    Holding:
      type: object
      required: [symbol, name, currency, quantity, avgPrice, currentPrice, value, cost, pnl, long, cfd]
      properties:
        symbol: { type: string }
        name: { type: string }
        currency: { type: string, description: "the instrument's price currency (\"\" when unknown)" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        avgPrice: { $ref: "#/components/schemas/Decimal" }
        currentPrice: { $ref: "#/components/schemas/Decimal" }
        value: { $ref: "#/components/schemas/MinorUnits" }
        cost: { $ref: "#/components/schemas/MinorUnits" }
        pnl: { $ref: "#/components/schemas/MinorUnits" }
        openedAt: { type: string, format: date-time }
        long: { type: boolean }
        cfd: { type: boolean }
    Holdings:
      type: object
      required: [platform, currency, cash, invested, equity, unrealisedPnl, realisedPnl, positions, asOf]
      description: Amounts are minor units of `currency`, the account's own currency.
      properties:
        platform: { $ref: "#/components/schemas/Platform" }
        currency: { type: string }
        cash: { $ref: "#/components/schemas/MinorUnits" }
        invested: { $ref: "#/components/schemas/MinorUnits" }
        equity: { $ref: "#/components/schemas/MinorUnits" }
        unrealisedPnl: { $ref: "#/components/schemas/MinorUnits" }
        realisedPnl: { $ref: "#/components/schemas/MinorUnits" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Holding" }
        asOf: { type: string, format: date-time }
    AccountHoldings:
      type: object
      required: [account, noKeys]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        holdings: { $ref: "#/components/schemas/Holdings" }
        error: { type: string, description: why the account could not be read }
        noKeys: { type: boolean, description: the account's keys are not set yet }
    CurrencyTotal:
      type: object
      required: [currency, accounts, cash, equity, unrealisedPnl]
      properties:
        currency: { type: string }
        accounts: { type: integer }
        cash: { $ref: "#/components/schemas/MinorUnits" }
        equity: { $ref: "#/components/schemas/MinorUnits" }
        unrealisedPnl: { $ref: "#/components/schemas/MinorUnits" }
    Overview:
      type: object
      required: [accounts, totals, asOf]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountHoldings" }
        totals:
          type: array
          items: { $ref: "#/components/schemas/CurrencyTotal" }
        asOf: { type: string, format: date-time }
    EquityPoint:
      type: object
      required: [at, cash, equity]
      properties:
        at: { type: string, format: date-time }
        cash: { $ref: "#/components/schemas/MinorUnits" }
        equity: { $ref: "#/components/schemas/MinorUnits" }
    EquitySeries:
      type: object
      required: [accountId, name, platform, mode, currency, points]
      properties:
        accountId: { type: string }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        mode: { $ref: "#/components/schemas/TradingMode" }
        currency: { type: string }
        points:
          type: array
          items: { $ref: "#/components/schemas/EquityPoint" }
    AccountShare:
      type: object
      required: [userId, username, access, createdAt]
      properties:
        userId: { type: string }
        username: { type: string }
        access: { type: string, enum: [view, trade] }
        createdAt: { type: string, format: date-time }
    ShareAccountRequest:
      type: object
      required: [username, access]
      properties:
        username: { type: string, maxLength: 64 }
        access: { type: string, enum: [view, trade] }
    ThemeInput:
      type: object
      required: [name, keywords, industryId, enabled, instruments]
      properties:
        name: { type: string, maxLength: 60 }
        keywords: { type: array, maxItems: 10, items: { type: string, maxLength: 100 } }
        industryId: { type: integer, format: int64, minimum: 0, description: "0 = none" }
        enabled: { type: boolean }
        instruments: { type: array, maxItems: 50, items: { type: integer, format: int64 } }
        llmProfileId: { type: string, maxLength: 64, description: "the LLM reviewer profile for this theme's candidates (empty = the default profile)" }
    ThemeShare:
      type: object
      required: [instrumentId, symbol, name, market]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        name: { type: string }
        market: { type: string }
    Theme:
      allOf:
        - $ref: "#/components/schemas/ThemeInput"
        - type: object
          required: [id, shares, createdAt, updatedAt]
          properties:
            id: { type: string }
            shares:
              type: array
              description: the picked shares with their symbols
              items: { $ref: "#/components/schemas/ThemeShare" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Industry:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    ReviewCheck:
      type: object
      required: [rule, pass]
      properties:
        rule: { type: string }
        pass: { type: boolean }
        detail: { type: string }
    Review:
      type: object
      required: [instrumentId, symbol, theme, at, outcome, checks, summary]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        theme: { type: string }
        at: { type: string, format: date-time }
        outcome: { type: string, enum: [no_signal, candidate, added, skipped, error] }
        direction: { type: string, enum: [long, short] }
        probs:
          type: object
          additionalProperties: { type: number }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ReviewCheck" }
        summary: { type: string }
    ReviewBoard:
      type: object
      required: [scannerEnabled, reviews]
      properties:
        scannerEnabled: { type: boolean }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/Review" }
    ScannerSwitch:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    ScanResult:
      type: object
      required: [reviewed, added]
      properties:
        reviewed: { type: integer }
        added: { type: array, items: { type: string } }
    AuditEntry:
      type: object
      required: [id, at, actor, action, target, details, remoteIp]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actorId: { type: string }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        details: { type: string }
        remoteIp: { type: string }
