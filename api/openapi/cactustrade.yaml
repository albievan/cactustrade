        - { name: ours, in: query, description: "true = only cactusTrade's trades, false = only the others (absent = all)", schema: { type: boolean } }
        - { name: before, in: query, description: "only trades closed before this time (the next page: the last row's closedAt)", schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
