        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/llm/usage:
    get:
      tags: [llm]
      operationId: getLlmUsage
      summary: LLM calls of the last days per profile and purpose, with tokens and cost (admin)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 400, default: 30 } }
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmUsage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/statements/schedules:
    get:
      tags: [statements]
      operationId: listStatementSchedules
      summary: The caller's trading-statement schedules (an admin sees every user's), the accounts the caller may put on one, and whether mail can go out (web UI)
      responses:
        "200":
          description: The statements section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatementsPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [statements]
      operationId: createStatementSchedule
      summary: Add a statement schedule owned by the caller (web UI; audited)
      description: |
        Accounts must be ones the caller owns (an admin: accounts the admin can see); no
        accounts = every such account when the statement is made. 1 to 10 recipients, any
        address. The first scheduled e-mail is for the next period that closes; "Send now"
        sends the last complete one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatementScheduleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatementSchedule" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/statements/schedules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    put:
      tags: [statements]
      operationId: updateStatementSchedule
      summary: Change a statement schedule (its owner or an admin, web UI; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatementScheduleInput" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatementSchedule" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [statements]
      operationId: deleteStatementSchedule
      summary: Delete a statement schedule (its owner or an admin, web UI; audited)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/statements/schedules/{id}/send-now:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    post:
      tags: [statements]
      operationId: sendStatementNow
      summary: E-mail the statements of the schedule's last complete period now (its owner or an admin, web UI; audited; once a minute)
      description: Counts as an export for the rate limits.
      responses:
        "200":
          description: Queued in the outbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatementSendResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/statements/preview.pdf:
    get:
      tags: [statements]
      operationId: previewStatement
      summary: Download one trading statement as a PDF without e-mailing it (web UI)
      description: |
        The combined statement of every account the caller may put on a schedule (with
        `scheduleId`: that schedule's accounts), one of them (`scope=account`, `accountId`)
        or one exchange across them (`scope=exchange`, `exchange`). The period of kind `period` that holds the risk day `from`; without
        `from` the last complete one. Counts as an export for the rate limits.
      parameters:
        - { name: period, in: query, required: true, schema: { $ref: "#/components/schemas/StatementPeriod" } }
        - { name: from, in: query, description: "a risk day in the period, YYYY-MM-DD (absent = the last complete period)", schema: { type: string, maxLength: 10 } }
        - { name: scope, in: query, schema: { $ref: "#/components/schemas/StatementScope" } }
        - { name: accountId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: exchange, in: query, schema: { type: string, enum: [LSE, NYSE, ASX, Other] } }
        - { name: scheduleId, in: query, description: "only that schedule's accounts (its owner or an admin)", schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: The PDF (sent as an attachment, never cached)
          headers:
            Content-Disposition:
              description: attachment with the file name
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/analysis:
    get:
      tags: [analysis]
      operationId: getAnalysis
      summary: Analysis of the trades of a period, grouped and explained (R31)
      description: |
        cactusTrade's closed trades of the period on the chosen accounts, grouped by date
        (bucket: day up to 31 days, week up to 186, month beyond), exchange, trading account,
        theme, direction, playbook and outcome; equity and drawdown per currency (never added
        across currencies); risk events; agent activity; and a narrative written from these
        figures (no LLM). Viewer, with view access to every account. Figures describe past
        results only.
      parameters:
        - { name: preset, in: query, description: "absent = custom when from or to is given, else this month", schema: { $ref: "#/components/schemas/AnalysisPreset" } }
        - { name: from, in: query, description: "custom range: the first risk day, YYYY-MM-DD", schema: { type: string, maxLength: 10 } }
        - { name: to, in: query, description: "custom range: the last risk day (inclusive), YYYY-MM-DD, not after today", schema: { type: string, maxLength: 10 } }
        - name: accountId
          in: query
          description: "the accounts (repeat the parameter; absent = every account you can see). An account you cannot see is 404."
          style: form
          explode: true
          schema: { type: array, maxItems: 50, items: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: The analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analysis" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/analysis.pdf:
    get:
      tags: [analysis]
      operationId: getAnalysisPdf
      summary: The analysis as a one-page PDF (R31)
      description: |
        The same analysis as `GET /api/v1/analysis`, laid out on one page whose height is
        chosen to fit the content (A4 when it fits). Sent as an attachment, never cached;
        counts as an export for the rate limits.
      parameters:
        - { name: preset, in: query, description: "absent = custom when from or to is given, else this month", schema: { $ref: "#/components/schemas/AnalysisPreset" } }
        - { name: from, in: query, description: "custom range: the first risk day, YYYY-MM-DD", schema: { type: string, maxLength: 10 } }
        - { name: to, in: query, description: "custom range: the last risk day (inclusive), YYYY-MM-DD, not after today", schema: { type: string, maxLength: 10 } }
        - name: accountId
          in: query
          description: "the accounts (repeat the parameter; absent = every account you can see). An account you cannot see is 404."
          style: form
          explode: true
          schema: { type: array, maxItems: 50, items: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: The PDF (sent as an attachment, never cached)
          headers:
            Content-Disposition:
              description: attachment with the file name
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Newest audit entries (admin)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cactustrade_session
    bearerApiKey:
      type: http
      scheme: bearer
      description: "API key: ctk_<id>_<secret>"
  parameters:
    AccountIdQuery:
      name: accountId
      in: query
      required: false
      description: The account (default the caller's current account)
      schema: { type: string, maxLength: 64 }
    HistoryDays:
      name: days
      in: query
      required: false
      description: The period in risk days, today included
      schema: { type: integer, minimum: 1, maximum: 400, default: 30 }
  responses:
    AgentStatus:
      description: The agent's state after the action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentStatusResult" }
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Health:
      description: Health
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Health" }
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        field: { type: string, description: The invalid field, for 400s }
        missing: { $ref: "#/components/schemas/Missing" }
        canFix: { type: boolean, description: "with missing: the caller may fix it (the web UI then shows a button to the fix)" }
    Missing:
      type: string
      description: >-
        Setup an action needs and does not have yet (R22). trading_budget: Risk limits; account_keys: the account's
        keys (Platform accounts); account: no eToro account (Platform accounts); watchlist: the watchlist is empty;
        reconcile: run a reconciliation; kill_reset: an admin resets the kill switch; llm_profile: the LLM reviewer
        has no usable default profile or key; email_server: no mail server (E-mail); public_url: the deployment
        setting CACTUSTRADE_PUBLIC_URL is not set.
      enum: [trading_budget, account_keys, account, watchlist, reconcile, kill_reset, llm_profile, email_server, public_url]
    MissingItem:
      type: object
      required: [what, canFix]
      properties:
        what: { $ref: "#/components/schemas/Missing" }
        canFix: { type: boolean, description: "the caller may fix it" }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        detail: { type: string }
    Role:
      type: string
      enum: [admin, operator, viewer]
    TradingMode:
      type: string
      enum: [demo, real]
    AgentState:
      type: string
      enum: [stopped, running, paused, killed]
    PublicStatus:
      type: object
      required: [version, passwordResetAvailable]
      properties:
        version: { type: string }
        passwordResetAvailable: { type: boolean, description: "\"Forgot password\" works (mail server and public address set)" }
    PasswordResetRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, maxLength: 64 }
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string, maxLength: 256 }
        password: { type: string, maxLength: 512 }
    NotifyPrefs:
      type: object
      required: [trades, watchlist, alerts]
      properties:
        trades: { type: boolean, description: "orders, fills and closes (buy, sell, short)" }
        watchlist: { type: boolean, description: "shares added to or removed from a watchlist" }
        alerts: { type: boolean, description: "warnings and errors: kill switch, limits, failures" }
    Profile:
      type: object
      required: [email, notify]
      properties:
        email: { type: string, maxLength: 254, description: "empty = no e-mail" }
        notify: { $ref: "#/components/schemas/NotifyPrefs" }
    ProfileInput:
      type: object
      required: [email, notify]
      properties:
        email: { type: string, maxLength: 254, description: "empty = no e-mail" }
        notify: { $ref: "#/components/schemas/NotifyPrefs" }
        currentPassword:
          type: string
          maxLength: 1024
          writeOnly: true
          description: Your current password; required when the e-mail address changes, never stored or returned
    SmtpPreset:
      type: object
      required: [id, label, host, port, tls]
      properties:
        id: { type: string }
        label: { type: string }
        host: { type: string }
        port: { type: integer }
        tls: { type: string }
    EmailSetupInput:
      type: object
      required: [enabled, host, port, username, from, tls]
      properties:
        enabled: { type: boolean, description: "use this server for all e-mail" }
        host: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 0, maximum: 65535 }
        username: { type: string, maxLength: 254 }
        from: { type: string, maxLength: 320, description: "Send as: Name <address>; empty = the user name" }
        tls: { type: string, enum: [starttls, tls, none] }
        password: { type: string, maxLength: 1024, description: "write-only; absent = keep, empty = remove" }
    EmailSetup:
      type: object
      required: [enabled, host, port, username, from, tls, passwordSet, warnings, fallback, presets]
      properties:
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        from: { type: string }
        tls: { type: string }
        passwordSet: { type: boolean }
        warnings: { type: array, items: { type: string } }
        fallback: { type: string, description: "the deployment's server, used while this one is off (empty = none)" }
        presets: { type: array, items: { $ref: "#/components/schemas/SmtpPreset" } }
    TestEmailRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, maxLength: 254 }
    OutboxMail:
      type: object
      required: [id, to, subject, createdAt, attempts, lastError]
      properties:
        id: { type: string }
        to: { type: string }
        subject: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
        attempts: { type: integer }
        lastError: { type: string }
    SystemStatus:
      type: object
      required: [version, build, mode, agentState, database, startedAt, now]
      properties:
        version: { type: string }
        build: { type: string }
        mode: { $ref: "#/components/schemas/TradingMode" }
        agentState: { $ref: "#/components/schemas/AgentState" }
        database: { type: string, enum: [sqlite, mariadb] }
        startedAt: { type: string, format: date-time }
        now: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/Account" }
        realArmed:
          type: array
          description: "the accounts the caller can see whose real trading is armed (the banner on every page); always empty in this build"
          items: { $ref: "#/components/schemas/RealArmedAccount" }
        realArmedUnknown:
          type: boolean
          description: "the gate of at least one real account the caller can see could not be read: the banner says the real-trading state is unknown (never 'not armed')"
    RealArmedAccount:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    SystemHealth:
      type: object
      required: [ok, at, startedAt, agentLoop, accounts, problems]
      properties:
        ok: { type: boolean }
        at: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        lastSupervisorTick: { type: string, format: date-time, description: "absent = the supervisor loop has not ticked yet" }
        agentLoop: { type: boolean, description: "false when the start-up resume failed and the agent loop does not run" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountHealth" }
        problems:
          type: array
          items: { type: string }
    AccountHealth:
      type: object
      required: [accountId, mode, supervised, agentState, killed, reconciled, leaseHeld, nonFinalOrders, realGateArmed, ok]
      properties:
        accountId: { type: string }
        name: { type: string, description: "only for accounts the caller can see" }
        mode: { $ref: "#/components/schemas/TradingMode" }
        supervised: { type: boolean, description: "the supervisor is expected to pass over it" }
        agentState: { $ref: "#/components/schemas/AgentState" }
        killed: { type: boolean }
        reconciled: { type: boolean }
        lastSupervisorPass: { type: string, format: date-time, description: "absent = none in this process" }
        lastCleanSupervisorPass: { type: string, format: date-time, description: "latest pass without errors; absent = none" }
        leaseHeld: { type: boolean }
        nonFinalOrders: { type: integer, description: "our orders that are not final" }
        realGateArmed: { type: boolean }
        ok: { type: boolean }
        problem: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 256 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 256 }
        newPassword: { type: string, maxLength: 256 }
    User:
      type: object
      required: [id, username, role, disabled, mustChangePassword, createdAt, updatedAt]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        mustChangePassword:
          type: boolean
          description: |
            The account still has the default password (the built-in admin/admin). Until it
            is changed, every endpoint except /auth/me, /auth/password and /auth/logout
            answers 403 with the title "Password change required".
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Me:
      type: object
      required: [user, permissions, via]
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions:
          type: array
          items: { type: string }
        via: { type: string, enum: [session, apikey] }
        csrfToken:
          type: string
          description: Send as X-CSRF-Token on state-changing requests (session only)
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 256 }
        role: { $ref: "#/components/schemas/Role" }
    UpdateUserRequest:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        password: { type: string, maxLength: 256 }
    ApiKey:
      type: object
      required: [id, ownerId, name, role, createdAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    CreateApiKeyRequest:
      type: object
      required: [name, role]
      properties:
        name: { type: string, maxLength: 64 }
        role: { $ref: "#/components/schemas/Role" }
        expiresInDays: { type: integer, minimum: 0, maximum: 365, description: 0 = never }
    CreatedApiKey:
      type: object
      required: [apiKey, secret]
      properties:
        apiKey: { $ref: "#/components/schemas/ApiKey" }
        secret: { type: string, description: "Bearer value; shown once, never again" }
    CredentialName:
      type: string
      enum: [etoro_demo_api_key, etoro_demo_user_key, etoro_real_api_key, etoro_real_user_key]
    Credential:
      type: object
      required: [name, label, set]
      properties:
        name: { $ref: "#/components/schemas/CredentialName" }
        label: { type: string }
        set: { type: boolean }
        source: { type: string, enum: [ui, env], description: "env = from an environment variable; read-only here" }
        envVar: { type: string, description: The environment variable that may provide it }
        updatedAt: { type: string, format: date-time }
    Cents:
      type: integer
      format: int64
      description: US dollars in cents (the eToro account currency is USD)
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'
      description: An exact decimal (prices and units, up to 6 places)
    Market:
      type: string
      enum: ["", LSE, NYSE, ASX]
      description: LSE, NYSE (NYSE and NASDAQ share a calendar), ASX or "" when not tradable here
    BrokerCheck:
      type: object
      required: [mode, ok, latencyMs, checkedAt, configuredKeys]
      properties:
        mode: { $ref: "#/components/schemas/TradingMode" }
        ok: { type: boolean }
        error: { type: string }
        configuredKeys: { type: boolean, description: false when the mode's key pair is not set }
        latencyMs: { type: integer, format: int64 }
        availableCashCents: { $ref: "#/components/schemas/Cents" }
        equityCents: { $ref: "#/components/schemas/Cents" }
        positions: { type: integer }
        nonConforming: { type: integer, description: positions that are not real shares, long, leverage 1 }
        checkedAt: { type: string, format: date-time }
    Position:
      type: object
      required: [positionId, instrumentId, openedAt, openRate, units, amountCents, unrealisedPnlCents, realAsset, long, leverage]
      properties:
        positionId: { type: integer, format: int64 }
        instrumentId: { type: integer, format: int64 }
        openedAt: { type: string, format: date-time }
        openRate: { $ref: "#/components/schemas/Decimal" }
        units: { $ref: "#/components/schemas/Decimal" }
        amountCents: { $ref: "#/components/schemas/Cents" }
        unrealisedPnlCents: { $ref: "#/components/schemas/Cents" }
        stopLossRate: { $ref: "#/components/schemas/Decimal" }
        takeProfitRate: { $ref: "#/components/schemas/Decimal" }
        realAsset: { type: boolean }
        long: { type: boolean }
        leverage: { type: integer }
    Portfolio:
      type: object
      required: [mode, availableCashCents, pendingOpenCents, equityCents, positions, asOf]
      properties:
        mode: { $ref: "#/components/schemas/TradingMode" }
        availableCashCents: { $ref: "#/components/schemas/Cents" }
        pendingOpenCents: { $ref: "#/components/schemas/Cents" }
        equityCents: { $ref: "#/components/schemas/Cents" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        asOf: { type: string, format: date-time }
    MarketSession:
      type: object
      required: [market, trading, open]
      properties:
        market: { $ref: "#/components/schemas/Market" }
        trading: { type: boolean, description: the market trades today (its local date) }
        open: { type: boolean, description: in its trading session right now }
        opens: { type: string, format: date-time }
        closes: { type: string, format: date-time }
        note: { type: string }
    Instrument:
      type: object
      required: [instrumentId, symbol, name, type, market]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        name: { type: string }
        type: { type: string }
        exchangeId: { type: integer, format: int64 }
        market: { $ref: "#/components/schemas/Market" }
    Eligibility:
      type: object
      required: [realLong]
      properties:
        realLong: { type: boolean, description: can be bought as a real share, long, leverage 1 }
        reason: { type: string }
        minPositionCents: { $ref: "#/components/schemas/Cents" }
        checkedAt: { type: string, format: date-time }
    WatchItem:
      type: object
      required: [instrument, eligibility, addedBy, addedAt, origin]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        eligibility: { $ref: "#/components/schemas/Eligibility" }
        addedBy: { type: string }
        addedAt: { type: string, format: date-time }
        origin:
          type: string
          enum: [user, scanner, research]
          description: "who put it on the watchlist: a person, the scanner or web research (R29)"
        themeId: { type: string, description: "the account's theme this share is in (absent = none; R27)" }
        holding: { $ref: "#/components/schemas/WatchHolding" }
    WatchHolding:
      type: object
      description: What the account holds of one instrument, from the portfolio view cache (a view only)
      required: [instrumentId, symbol, name, market, positions, units, valueCents, costCents, pnlCents, ours, shorts]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        name: { type: string }
        market: { type: string, description: "LSE, NYSE (also NASDAQ), ASX, or empty when not known" }
        positions: { type: integer }
        units: { $ref: "#/components/schemas/Decimal" }
        valueCents: { $ref: "#/components/schemas/Cents" }
        costCents: { $ref: "#/components/schemas/Cents" }
        pnlCents: { $ref: "#/components/schemas/Cents" }
        ours: { type: integer, description: "positions cactusTrade opened" }
        shorts: { type: integer }
    WatchlistHoldings:
      type: object
      required: [known, stale, currency, watchlistValueCents, watchlistPnlCents, watchlistPositions, notOnWatchlist]
      properties:
        known: { type: boolean, description: "a portfolio was read" }
        stale: { type: boolean, description: "older than 30 s, or none" }
        asOf: { type: string, format: date-time }
        error: { type: string, description: "why the portfolio is not known" }
        currency: { type: string }
        watchlistValueCents: { $ref: "#/components/schemas/Cents" }
        watchlistPnlCents: { $ref: "#/components/schemas/Cents" }
        watchlistPositions: { type: integer }
        notOnWatchlist:
          type: array
          items: { $ref: "#/components/schemas/WatchHolding" }
    WatchlistOverview:
      type: object
      required: [canEdit, holdings]
      properties:
        canEdit: { type: boolean, description: "the caller has trade access to the current account" }
        holdings: { $ref: "#/components/schemas/WatchlistHoldings" }
    ThemeAssignment:
      type: object
      required: [instrumentId, themeId]
      properties:
        instrumentId: { type: integer, format: int64, minimum: 1 }
        themeId: { type: string, maxLength: 64, description: "empty = no theme" }
    ThemeAssignmentsRequest:
      type: object
      required: [assignments]
      properties:
        assignments: { type: array, minItems: 1, maxItems: 200, items: { $ref: "#/components/schemas/ThemeAssignment" } }
    ThemeAssignmentsResult:
      type: object
      required: [changedThemes]
      properties:
        changedThemes: { type: integer, description: "themes stored" }
    ThemeProposal:
      type: object
      required: [instrumentId, symbol, themeId, themeName, score, reasons]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        themeId: { type: string }
        themeName: { type: string }
        score: { type: integer }
        reasons: { type: array, items: { type: string } }
    ThemeProposals:
      type: object
      required: [proposals, unmatched, notes]
      properties:
        proposals: { type: array, items: { $ref: "#/components/schemas/ThemeProposal" } }
        unmatched: { type: array, items: { type: string }, description: "symbols of shares without a theme that no theme matches" }
        notes: { type: array, items: { type: string } }
    WatchlistFileShare:
      type: object
      required: [instrumentId, symbol, market]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string, maxLength: 32 }
        market: { type: string, maxLength: 16 }
    WatchlistFileTheme:
      type: object
      required: [name, keywords, industryId, instruments]
      properties:
        name: { type: string, maxLength: 60 }
        keywords: { type: array, maxItems: 10, items: { type: string, maxLength: 100 } }
        industryId: { type: integer, format: int64, minimum: 0 }
        instruments: { type: array, maxItems: 50, items: { type: integer, format: int64 } }
        llmProfileName: { type: string, maxLength: 60 }
    WatchlistFileAccount:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
    WatchlistFile:
      type: object
      description: A cactusTrade watchlist file (R27). No secrets, no account ids.
      required: [version, exportedAt, account, watchlist, themes]
      properties:
        version: { type: integer, enum: [1] }
        exportedAt: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/WatchlistFileAccount" }
        watchlist: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/WatchlistFileShare" } }
        themes: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/WatchlistFileTheme" } }
    ImportSkip:
      type: object
      required: [name, reason]
      properties:
        instrumentId: { type: integer, format: int64 }
        name: { type: string, description: "the share's symbol or the theme's name" }
        reason: { type: string }
    WatchlistImportResult:
      type: object
      required: [added, already, skipped, themesCreated, themesUpdated, themesUnchanged, themesSkipped, notes]
      properties:
        added: { type: array, items: { type: string } }
        already: { type: array, items: { type: string }, description: "already on the watchlist" }
        skipped: { type: array, items: { $ref: "#/components/schemas/ImportSkip" } }
        themesCreated: { type: array, items: { type: string } }
        themesUpdated: { type: array, items: { type: string } }
        themesUnchanged: { type: array, items: { type: string } }
        themesSkipped: { type: array, items: { $ref: "#/components/schemas/ImportSkip" } }
        notes: { type: array, items: { type: string } }
    AddWatchRequest:
      type: object
      required: [instrumentId]
      properties:
        instrumentId: { type: integer, format: int64, minimum: 1 }
    Quote:
      type: object
      required: [instrumentId, bid, ask, at, delayed]
      properties:
        instrumentId: { type: integer, format: int64 }
        bid: { $ref: "#/components/schemas/Decimal" }
        ask: { $ref: "#/components/schemas/Decimal" }
        at: { type: string, format: date-time }
        delayed: { type: boolean }
    Event:
      type: object
      required: [id, at, kind, severity, title, actor]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string }
        severity: { type: string, enum: [info, success, warning, danger] }
        title: { type: string }
        detail: { type: string }
        actor: { type: string }
        accountId: { type: string, description: "the account the event is about (absent = system-wide)" }
    EventFeed:
      type: object
      required: [events, unread]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        unread: { type: integer }
    TradeMinimumsView:
      type: object
      required: [canDecide]
      properties:
        review: { $ref: "#/components/schemas/MinimumsReview" }
        canDecide: { type: boolean, description: "the caller may approve the pending proposal now" }
        decideHint: { type: string, description: "why the caller may not approve now" }
    MinimumsReview:
      type: object
      required: [id, at, platform, longCents, shortCents, longLowestCents, shortLowestCents, instruments, longKnown, shortKnown, equityCents, current, proposed, longRoomCents, shortRoomCents, changes, problems, status]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        platform: { type: string }
        longCents: { $ref: "#/components/schemas/Cents" }
        shortCents: { $ref: "#/components/schemas/Cents" }
        longLowestCents: { $ref: "#/components/schemas/Cents" }
        shortLowestCents: { $ref: "#/components/schemas/Cents" }
        instruments: { type: integer, description: "how many shares were looked at" }
        longKnown: { type: integer }
        shortKnown: { type: integer }
        equityCents: { $ref: "#/components/schemas/Cents" }
        current: { $ref: "#/components/schemas/RiskLimits" }
        proposed: { $ref: "#/components/schemas/RiskLimits" }
        longRoomCents: { $ref: "#/components/schemas/Cents" }
        shortRoomCents: { $ref: "#/components/schemas/Cents" }
        changes: { type: array, items: { type: string } }
        problems: { type: array, items: { type: string } }
        status: { type: string, enum: [fits, pending, approved, declined, blocked] }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
    RiskLimits:
      type: object
      required: [tradingBudgetCents, dailyLossBp, drawdownBp, maxPositionBp, maxOpenPositions, noEntryBeforeCloseMinutes, flattenBeforeCloseMinutes, maxPortfolioAgeSeconds, maxQuoteAgeSeconds, maxShortBp]
      properties:
        tradingBudgetCents: { $ref: "#/components/schemas/Cents" }
        dailyLossBp: { type: integer, description: "stop new entries at this loss from the start-of-day equity (bp; 200 = 2 %)" }
        drawdownBp: { type: integer, description: "kill switch at this fall from the high-water mark (bp)" }
        maxPositionBp: { type: integer, description: "largest position as a share of equity (bp; 0 = off)" }
        maxOpenPositions: { type: integer }
        noEntryBeforeCloseMinutes: { type: integer }
        flattenBeforeCloseMinutes: { type: integer }
        maxPortfolioAgeSeconds: { type: integer }
        maxQuoteAgeSeconds: { type: integer }
        maxShortBp: { type: integer, description: "all short exposure as a share of the trading budget (bp; 0 = no shorts; at most 2500 = 25 %)" }
    RiskLimitsView:
      description: The limits as GET returns them, with whether the caller may change them now (not part of the PUT body)
      allOf:
        - $ref: "#/components/schemas/RiskLimits"
        - type: object
          required: [canEdit, preset]
          properties:
            canEdit: { type: boolean, description: "the caller may change the limits now (same rules as the PUT)" }
            editBlockedReason: { type: string, description: "why not, for people (absent when canEdit)" }
            preset: { $ref: "#/components/schemas/RiskPresetMatch" }
    RiskPresetId:
      type: string
      enum: [low, low_medium, medium, medium_high, high]
    RiskPresetMatch:
      type: string
      description: the preset the limits match, or custom
      enum: [low, low_medium, medium, medium_high, high, custom]
    RiskLimitsChange:
      type: object
      description: |
        A change of limits: `preset` alone, or every limit of RiskLimits (a custom set).
      properties:
        preset: { $ref: "#/components/schemas/RiskPresetId" }
        tradingBudgetCents: { $ref: "#/components/schemas/Cents" }
        dailyLossBp: { type: integer }
        drawdownBp: { type: integer }
        maxPositionBp: { type: integer }
        maxOpenPositions: { type: integer }
        noEntryBeforeCloseMinutes: { type: integer }
        flattenBeforeCloseMinutes: { type: integer }
        maxPortfolioAgeSeconds: { type: integer }
        maxQuoteAgeSeconds: { type: integer }
        maxShortBp: { type: integer }
    RiskPreset:
      type: object
      required: [id, label, summary, dailyLossBp, drawdownBp, maxPositionBp, maxOpenPositions, maxShortBp]
      properties:
        id: { $ref: "#/components/schemas/RiskPresetId" }
        label: { type: string, description: "the preset's name for people" }
        summary: { type: string, description: "its limits in plain words" }
        dailyLossBp: { type: integer }
        drawdownBp: { type: integer }
        maxPositionBp: { type: integer }
        maxOpenPositions: { type: integer }
        maxShortBp: { type: integer }
    RiskPresetList:
      type: object
      required: [presets, current, clamped]
      properties:
        presets:
          type: array
          items: { $ref: "#/components/schemas/RiskPreset" }
        current: { $ref: "#/components/schemas/RiskPresetMatch" }
        clamped: { type: boolean, description: "a real-money account: every preset is capped at the real ceilings" }
    StyleLevel:
      type: string
      enum: [low, medium, high, full]
    StyleLevelText:
      type: object
      required: [id, label, summary]
      properties:
        id: { $ref: "#/components/schemas/StyleLevel" }
        label: { type: string }
        summary: { type: string, description: "what the level does, in plain words" }
    AutonomyPolicy:
      type: object
      description: what the autonomy level lets the platform do by itself
      required: [researchMode, scanEveryMinutes, ownerSharesOnly, autoAssignThemes, pruneStale, autoStart, adaptAggressiveness]
      properties:
        researchMode: { $ref: "#/components/schemas/ResearchMode" }
        scanEveryMinutes: { type: integer }
        ownerSharesOnly: { type: boolean }
        autoAssignThemes: { type: boolean }
        pruneStale: { type: boolean }
        autoStart: { type: boolean, description: "never on a real-money account (OD26)" }
        adaptAggressiveness: { type: boolean }
    AgentStyle:
      type: object
      required: [aggressiveness, effectiveAggressiveness, autonomy, policy, aggressivenessLevels, autonomyLevels, canEdit]
      properties:
        aggressiveness: { $ref: "#/components/schemas/StyleLevel" }
        effectiveAggressiveness: { $ref: "#/components/schemas/StyleLevel" }
        autonomy: { $ref: "#/components/schemas/StyleLevel" }
        policy: { $ref: "#/components/schemas/AutonomyPolicy" }
        aggressivenessLevels:
          type: array
          items: { $ref: "#/components/schemas/StyleLevelText" }
        autonomyLevels:
          type: array
          items: { $ref: "#/components/schemas/StyleLevelText" }
        canEdit: { type: boolean }
        editBlockedReason: { type: string }
    AgentStyleChange:
      type: object
      properties:
        aggressiveness: { $ref: "#/components/schemas/StyleLevel" }
        autonomy: { $ref: "#/components/schemas/StyleLevel" }
    ResearchConfig:
      type: object
      required: [profileId, maxShares, runsPerDay]
      properties:
        profileId: { type: string, maxLength: 64, description: "the LLM profile research uses (empty = the default reviewer profile)" }
        maxShares: { type: integer, minimum: 1, maximum: 20, description: "at most this many shares per run" }
        runsPerDay: { type: integer, minimum: 0, maximum: 24, description: "runs per account in 24 hours (0 = research off)" }
    ResearchSetup:
      type: object
      required: [config, missing]
      properties:
        config: { $ref: "#/components/schemas/ResearchConfig" }
        profileId: { type: string, description: "the profile research uses now (absent = none usable)" }
        profileName: { type: string }
        note: { type: string, description: "why research cannot run, for people (absent = it can)" }
        missing:
          type: array
          items: { $ref: "#/components/schemas/MissingItem" }
    ResearchProposal:
      type: object
      required: [id, instrumentId, at, symbol, exchange, name, reason, sources]
      description: A share web research named, waiting for the owner. Untrusted text from the web, shown as plain text; links are never fetched by the server.
      properties:
        id: { type: string }
        instrumentId: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        symbol: { type: string }
        exchange: { type: string, enum: [LSE, NYSE, NASDAQ, ASX] }
        name: { type: string }
        theme: { type: string }
        reason: { type: string, maxLength: 300 }
        sources:
          type: array
          maxItems: 3
          items: { type: string, description: "an http(s) link, shown as text" }
    ResearchRefusal:
      type: object
      required: [symbol, reason]
      properties:
        symbol: { type: string }
        reason: { type: string }
    ResearchAddedShare:
      type: object
      required: [instrumentId, symbol, name, reason]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        name: { type: string }
        theme: { type: string, description: "the theme it was put in (absent = none)" }
        reason: { type: string }
    ResearchMode:
      type: string
      enum: ["off", propose, auto_add]
      description: "off; propose: results wait on the Watchlist page; auto_add: eligible results join the watchlist at once"
    ResearchRun:
      type: object
      required: [mode, added, proposed, refused, inputTokens, outputTokens]
      properties:
        mode: { $ref: "#/components/schemas/ResearchMode" }
        added:
          type: array
          items: { $ref: "#/components/schemas/ResearchAddedShare" }
        proposed:
          type: array
          items: { $ref: "#/components/schemas/ResearchProposal" }
        refused:
          type: array
          items: { $ref: "#/components/schemas/ResearchRefusal" }
        error: { type: string, description: "the provider failed: nothing was added" }
        callId: { type: string, description: "the logged LLM call (purpose research)" }
        model: { type: string }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        costUsd: { $ref: "#/components/schemas/UsdCost" }
    ResearchView:
      type: object
      required: [mode, config, ready, missing, runsUsed, proposals, canRun, canDecide]
      properties:
        mode: { $ref: "#/components/schemas/ResearchMode" }
        config: { $ref: "#/components/schemas/ResearchConfig" }
        profileName: { type: string }
        ready: { type: boolean, description: "research can run for this account" }
        note: { type: string, description: "why not, for people" }
        missing:
          type: array
          items: { $ref: "#/components/schemas/MissingItem" }
        runsUsed: { type: integer, description: "runs in the last 24 hours" }
        lastRunAt: { type: string, format: date-time }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/ResearchProposal" }
        canRun: { type: boolean, description: "the caller may press Research now" }
        canDecide: { type: boolean, description: "the caller may accept or dismiss proposals" }
    LlmProvider:
      type: object
      required: [id, label, defaultBaseUrl, keyRequired, note, webSearch]
      properties:
        id: { type: string }
        label: { type: string }
        defaultBaseUrl: { type: string }
        keyRequired: { type: boolean }
        note: { type: string }
        webSearch: { type: boolean, description: "the provider has a built-in web search web research can use (R29); else research not supported" }
    LlmProfile:
      type: object
      required: [id, name, provider, model, baseUrl, timeoutSeconds, keySet, inputPricePerMTok, outputPricePerMTok]
      properties:
        inputPricePerMTok: { $ref: "#/components/schemas/LlmPrice" }
        outputPricePerMTok: { $ref: "#/components/schemas/LlmPrice" }
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        model: { type: string, description: "empty = the provider's default (Anthropic: claude-opus-5-5)" }
        baseUrl: { type: string, description: "empty = the provider's address" }
        timeoutSeconds: { type: integer }
        keySet: { type: boolean }
    LlmPrice:
      type: string
      pattern: '^([0-9]{1,7}(\.[0-9]{1,6})?)?$'
      description: "What the provider charges in USD per million tokens, as entered by the admin (OD13: no built-in price table). \"\" or \"0\" = unknown, and then every call's cost is unknown. At most 1000000."
    LlmProfileInput:
      type: object
      required: [name, provider, model, baseUrl, timeoutSeconds, inputPricePerMTok, outputPricePerMTok]
      properties:
        inputPricePerMTok: { $ref: "#/components/schemas/LlmPrice" }
        outputPricePerMTok: { $ref: "#/components/schemas/LlmPrice" }
        name: { type: string, maxLength: 80, description: "empty = provider and model" }
        provider: { type: string, maxLength: 32 }
        model: { type: string, maxLength: 200 }
        baseUrl: { type: string, maxLength: 500 }
        timeoutSeconds: { type: integer, minimum: 0, maximum: 600 }
        apiKey: { type: string, maxLength: 4096, description: "write-only; absent = keep the stored key, empty = remove it" }
    LlmSettings:
      type: object
      required: [enabled, activeProfileId]
      properties:
        enabled: { type: boolean, description: "review every proposed trade (any reviewer failure rejects the trade)" }
        activeProfileId: { type: string, maxLength: 64, description: "the profile reviews use (empty = none)" }
    LlmModelsRequest:
      type: object
      required: [provider, baseUrl]
      properties:
        provider: { type: string, maxLength: 32 }
        baseUrl: { type: string, maxLength: 500 }
        apiKey: { type: string, maxLength: 4096, description: "the key typed on the page; absent = the stored key of profileId" }
        profileId: { type: string, maxLength: 64 }
    LlmSetup:
      type: object
      required: [settings, profiles, providers, defaultAnthropicModel]
      properties:
        settings: { $ref: "#/components/schemas/LlmSettings" }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/LlmProfile" }
        defaultAnthropicModel: { type: string }
        providers:
          type: array
          items: { $ref: "#/components/schemas/LlmProvider" }
    LlmTestResult:
      type: object
      required: [ok, latencyMs]
      properties:
        ok: { type: boolean }
        verdict: { type: string, enum: [approve, reduce, reject] }
        sizeMultiplier: { type: number }
        reason: { type: string }
        error: { type: string }
        latencyMs: { type: integer, format: int64 }
        model: { type: string, description: "the model that answered (the one asked for when there was no answer)" }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        costUsd: { $ref: "#/components/schemas/UsdCost" }
        callId: { type: string, description: "the logged call (purpose test); absent when it could not be logged" }
    Platform:
      type: string
      enum: [etoro, trading212, saxo, tiger]
      description: eToro (traded), or Trading 212, Saxo or Tiger Brokers (view-only)
    CredentialSpec:
      type: object
      required: [key, label, help, multiline, optional, setByFlow]
      description: One credential of a platform account (never its value)
      properties:
        key: { type: string, description: "the name used in SetAccountKeysRequest.values" }
        label: { type: string }
        help: { type: string }
        multiline: { type: boolean, description: a PEM key; line breaks are kept }
        optional: { type: boolean }
        setByFlow: { type: boolean, description: "set by the platform's sign-in (Saxo's Connect), not typed in" }
    PlatformInfo:
      type: object
      required: [platform, label, viewOnly, connectable, credentials]
      properties:
        platform: { $ref: "#/components/schemas/Platform" }
        label: { type: string }
        viewOnly: { type: boolean, description: cactusTrade shows the platform's accounts but never trades them }
        connectable: { type: boolean, description: the platform signs in through the browser (Saxo) }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/CredentialSpec" }
    AccountCredential:
      allOf:
        - $ref: "#/components/schemas/CredentialSpec"
        - type: object
          required: [set]
          properties:
            set: { type: boolean }
            updatedAt: { type: string, format: date-time, description: when it was last stored (absent when unknown) }
    ConnectStart:
      type: object
      required: [authorizeUrl, redirectUri]
      properties:
        authorizeUrl: { type: string, description: "Saxo's sign-in page; open it in this browser" }
        redirectUri: { type: string, description: the address registered for the app in the Saxo developer portal }
    Account:
      type: object
      required: [id, name, ownerId, ownerName, mode, platform, envKeys, access, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        mode: { $ref: "#/components/schemas/TradingMode" }
        platform: { $ref: "#/components/schemas/Platform" }
        envKeys: { type: boolean, description: "uses the deployment's ETORO_DEMO_PUB / _PK" }
        access: { type: string, enum: [view, trade, owner] }
        createdAt: { type: string, format: date-time }
    CreateAccountRequest:
      type: object
      required: [name, mode]
      properties:
        name: { type: string, maxLength: 60 }
        mode: { $ref: "#/components/schemas/TradingMode" }
        platform: { $ref: "#/components/schemas/Platform" }
    RenameAccountRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
    AccountRef:
      type: object
      required: [accountId]
      properties:
        accountId: { type: string, maxLength: 64 }
    AccountKeys:
      type: object
      required: [apiKeySet, userKeySet, fromEnvironment, complete, credentials, connectable]
      properties:
        apiKeySet: { type: boolean, description: the platform's first credential is set }
        userKeySet: { type: boolean, description: the platform's second credential is set }
        fromEnvironment: { type: boolean }
        complete: { type: boolean, description: enough is set to read the account }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/AccountCredential" }
        connectable: { type: boolean, description: the platform signs in through the browser (Saxo) }
        connectRedirectUri: { type: string, description: "the redirect address to register with the platform (absent without CACTUSTRADE_PUBLIC_URL)" }
    SetAccountKeysRequest:
      type: object
      properties:
        apiKey: { type: string, maxLength: 4096, description: "the platform's first credential (eToro Public API Key…); empty = keep" }
        userKey: { type: string, maxLength: 4096, description: "the platform's second credential (eToro User Key…); empty = keep" }
        values:
          type: object
          maxProperties: 8
          additionalProperties: { type: string, maxLength: 4096 }
          description: "credentials by key (CredentialSpec.key); empty = keep"
    MinorUnits:
      type: integer
      format: int64
      description: |
        An amount in minor units of the currency given next to it: hundredths for most (USD
        cents, GBP pence…), whole units for JPY and KRW.
    Holding:
      type: object
      required: [symbol, name, currency, quantity, avgPrice, currentPrice, value, cost, pnl, long, cfd, unknown]
      properties:
        unknown: { type: boolean, description: "the platform did not report value and P&L in the account currency: value, cost and pnl are 0 and mean unknown" }
        symbol: { type: string }
        name: { type: string }
        currency: { type: string, description: "the instrument's price currency (\"\" when unknown)" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        avgPrice: { $ref: "#/components/schemas/Decimal" }
        currentPrice: { $ref: "#/components/schemas/Decimal" }
        value: { $ref: "#/components/schemas/MinorUnits" }
        cost: { $ref: "#/components/schemas/MinorUnits" }
        pnl: { $ref: "#/components/schemas/MinorUnits" }
        openedAt: { type: string, format: date-time }
        long: { type: boolean }
        cfd: { type: boolean }
    Holdings:
      type: object
      required: [platform, currency, cash, invested, equity, unrealisedPnl, realisedPnl, positions, asOf]
      description: Amounts are minor units of `currency`, the account's own currency.
      properties:
        platform: { $ref: "#/components/schemas/Platform" }
        currency: { type: string }
        cash: { $ref: "#/components/schemas/MinorUnits" }
        invested: { $ref: "#/components/schemas/MinorUnits" }
        equity: { $ref: "#/components/schemas/MinorUnits" }
        unrealisedPnl: { $ref: "#/components/schemas/MinorUnits" }
        realisedPnl: { $ref: "#/components/schemas/MinorUnits" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Holding" }
        asOf: { type: string, format: date-time }
    AccountHoldings:
      type: object
      required: [account, noKeys]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        holdings: { $ref: "#/components/schemas/Holdings" }
        error: { type: string, description: why the account could not be read }
        noKeys: { type: boolean, description: the account's keys are not set yet }
        reconnect: { type: boolean, description: "the platform's sign-in has lapsed (Saxo): the owner connects again" }
    CurrencyTotal:
      type: object
      required: [currency, accounts, cash, equity, unrealisedPnl]
      properties:
        currency: { type: string }
        accounts: { type: integer }
        cash: { $ref: "#/components/schemas/MinorUnits" }
        equity: { $ref: "#/components/schemas/MinorUnits" }
        unrealisedPnl: { $ref: "#/components/schemas/MinorUnits" }
    Overview:
      type: object
      required: [accounts, totals, asOf]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountHoldings" }
        totals:
          type: array
          items: { $ref: "#/components/schemas/CurrencyTotal" }
        asOf: { type: string, format: date-time }
    EquityPoint:
      type: object
      required: [at, cash, equity]
      properties:
        at: { type: string, format: date-time }
        cash: { $ref: "#/components/schemas/MinorUnits" }
        equity: { $ref: "#/components/schemas/MinorUnits" }
    EquitySeries:
      type: object
      required: [accountId, name, platform, mode, currency, points]
      properties:
        accountId: { type: string }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        mode: { $ref: "#/components/schemas/TradingMode" }
        currency: { type: string }
        points:
          type: array
          items: { $ref: "#/components/schemas/EquityPoint" }
    AccountShare:
      type: object
      required: [userId, username, access, createdAt]
      properties:
        userId: { type: string }
        username: { type: string }
        access: { type: string, enum: [view, trade] }
        createdAt: { type: string, format: date-time }
    ShareAccountRequest:
      type: object
      required: [username, access]
      properties:
        username: { type: string, maxLength: 64 }
        access: { type: string, enum: [view, trade] }
    ThemeInput:
      type: object
      required: [name, keywords, industryId, enabled, instruments]
      properties:
        name: { type: string, maxLength: 60 }
        keywords: { type: array, maxItems: 10, items: { type: string, maxLength: 100 } }
        industryId: { type: integer, format: int64, minimum: 0, description: "0 = none" }
        enabled: { type: boolean }
        instruments: { type: array, maxItems: 50, items: { type: integer, format: int64 } }
        llmProfileId: { type: string, maxLength: 64, description: "the LLM reviewer profile for this theme's candidates (empty = the default profile)" }
    ThemeShare:
      type: object
      required: [instrumentId, symbol, name, market]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        name: { type: string }
        market: { type: string }
    Theme:
      allOf:
        - $ref: "#/components/schemas/ThemeInput"
        - type: object
          required: [id, shares, createdAt, updatedAt]
          properties:
            id: { type: string }
            shares:
              type: array
              description: the picked shares with their symbols
              items: { $ref: "#/components/schemas/ThemeShare" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Industry:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    ReviewCheck:
      type: object
      required: [rule, pass]
      properties:
        rule: { type: string }
        pass: { type: boolean }
        detail: { type: string }
    Review:
      type: object
      required: [instrumentId, symbol, theme, at, outcome, checks, summary, market, exchange]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        theme: { type: string }
        at: { type: string, format: date-time }
        outcome: { type: string, enum: [no_signal, candidate, added, skipped, proposed, error] }
        direction: { type: string, enum: [long, short] }
        probs:
          type: object
          additionalProperties: { type: number }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ReviewCheck" }
        summary: { type: string }
        market: { type: string, description: "the exchange's calendar market (LSE, NYSE, ASX); empty when the instrument is not cached" }
        exchange: { type: string, description: "the exchange named for people, e.g. New York (NYSE/NASDAQ); empty when unknown" }
    ReviewBoard:
      type: object
      required: [scannerEnabled, reviews]
      properties:
        scannerEnabled: { type: boolean }
        canAccept: { type: boolean, description: "the caller may add proposed shares to the watchlist (trade access)" }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/Review" }
    ScannerSwitch:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    ScanResult:
      type: object
      required: [reviewed, added]
      properties:
        reviewed: { type: integer }
        added: { type: array, items: { type: string } }
    AuditEntry:
      type: object
      required: [id, at, actor, action, target, details, remoteIp]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actorId: { type: string }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        details: { type: string }
        remoteIp: { type: string }
    AgentStatusResult:
      type: object
      required: [accountId, state]
      properties:
        accountId: { type: string }
        state: { $ref: "#/components/schemas/AgentState" }
    KillRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: "why (kept in the audit log and the event)" }
    KillReport:
      type: object
      required: [accountId, already, cancelled, closing, errors]
      properties:
        accountId: { type: string }
        already: { type: boolean, description: "the kill switch was already on (flattened again)" }
        cancelled: { type: integer, description: "cancels sent for cactusTrade's pending open orders" }
        closing: { type: integer, description: "closes sent or in flight for positions cactusTrade opened" }
        errors: { type: array, items: { type: string } }
    ResetKillRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, maxLength: 200, description: "exactly RESET <account name>" }
    Reconciliation:
      type: object
      required: [accountId, ok, reason]
      properties:
        accountId: { type: string }
        ok: { type: boolean, description: "eToro and our records agree; entries need it" }
        at: { type: string, format: date-time, description: "absent = not reconciled since the start" }
        reason: { type: string, description: "why not OK (empty when OK)" }
    RealGate:
      type: object
      required: [accountId, state, evidenceDays, version]
      properties:
        accountId: { type: string }
        state: { type: string, enum: [locked, armed] }
        demoAccountId: { type: string, description: "the linked demo account of the latest arming" }
        armedAt: { type: string, format: date-time }
        armedBy: { type: string, description: "user id" }
        expiresAt: { type: string, format: date-time }
        evidenceDays: { type: integer, description: "qualifying demo days recorded when armed" }
        disarmedAt: { type: string, format: date-time }
        disarmedBy: { type: string, description: "user id; absent with disarmedAt = the system" }
        disarmReason: { type: string }
        version: { type: integer, format: int64 }
    GateCheck:
      type: object
      required: [name, pass, detail]
      properties:
        name:
          type: string
          enum: [real_account, real_keys, real_reconciled, real_not_killed, real_agent_stopped, real_limits, demo_account, demo_evidence, arming_user, confirm_phrase]
        pass: { type: boolean }
        detail: { type: string }
    GateEvidence:
      type: object
      required: [days, count]
      properties:
        days: { type: array, items: { type: string }, description: "the qualifying risk days (YYYY-MM-DD, named after the day a 22:00 UTC risk day ends), oldest first" }
        count: { type: integer }
        first: { type: string, description: "YYYY-MM-DD" }
        last: { type: string, description: "YYYY-MM-DD" }
    EvidenceRule:
      type: object
      required: [minDays, windowDays, maxAgeDays]
      properties:
        minDays: { type: integer }
        windowDays: { type: integer }
        maxAgeDays: { type: integer }
    RealGateStatus:
      type: object
      required: [account, gate, armed, enabled, demoCandidates, checks, evidence, rule, phrase, canArm, canDisarm]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        gate: { $ref: "#/components/schemas/RealGate" }
        armed: { type: boolean, description: "armed and in force now" }
        enabled: { type: boolean, description: "this build may arm real trading at all (false until the owner's written consent)" }
        demoAccountId: { type: string, description: "the demo account the checklist is for; absent = none" }
        demoCandidates:
          type: array
          description: "the owner's eToro demo accounts the caller can see"
          items: { $ref: "#/components/schemas/Account" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/GateCheck" }
        evidence: { $ref: "#/components/schemas/GateEvidence" }
        rule: { $ref: "#/components/schemas/EvidenceRule" }
        phrase: { type: string, description: "what to type to arm" }
        canArm: { type: boolean, description: "the caller may submit an arm request (the server still checks everything)" }
        canDisarm: { type: boolean }
    ArmRealRequest:
      type: object
      required: [demoAccountId, confirm, password]
      properties:
        demoAccountId: { type: string, maxLength: 64 }
        confirm: { type: string, maxLength: 200, description: "ENABLE REAL TRADING <account name>" }
        password: { type: string, maxLength: 256, description: "the caller's current password (never logged or stored)" }
    DisarmRealRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 200 }
    ForceCloseRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 256, description: "the caller's current password (never logged or stored)" }
    ForceClosePlan:
      type: object
      required: [accountId, name, positions, orders, summary]
      properties:
        accountId: { type: string }
        name: { type: string }
        positions: { type: integer, description: "open positions cactusTrade opened" }
        orders: { type: integer, description: "open orders of cactusTrade's not final yet" }
        summary: { type: string, description: 'for people, e.g. "closes 3 positions and cancels 1 order on Demo"' }
    ForceCloseReport:
      type: object
      required: [accountId, name, cancelled, closing, state, errors]
      properties:
        accountId: { type: string }
        name: { type: string }
        cancelled: { type: integer, description: "cancels sent for cactusTrade's pending open orders" }
        closing: { type: integer, description: "closes sent or in flight for positions cactusTrade opened" }
        state: { $ref: "#/components/schemas/AgentState" }
        errors: { type: array, items: { type: string } }
    AgentCard:
      type: object
      required: [account, current, state, killed, reconciliation, limitsEditable, controls, openPositions, pendingOrders]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        current: { type: boolean, description: "the caller's current account (the limits form edits it)" }
        state: { $ref: "#/components/schemas/AgentState" }
        stateSince: { type: string, format: date-time, description: "when the agent entered this state; absent when unknown" }
        killed: { type: boolean }
        reconciliation: { $ref: "#/components/schemas/Reconciliation" }
        limitsEditable: { type: boolean, description: "the caller may change this account's limits now" }
        limitsBlockedReason: { type: string, description: "why not (absent when editable)" }
        controls: { $ref: "#/components/schemas/AgentControls" }
        openPositions: { type: integer }
        pendingOrders: { type: integer }
    WatchlistCount:
      type: object
      required: [account, count, current]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        count: { type: integer }
        current: { type: boolean }
    AgentControls:
      type: object
      required: [start, pause, stop, kill, reset, gated, forceClose]
      description: The agent actions the caller may take on this account
      properties:
        start: { type: boolean }
        pause: { type: boolean }
        stop: { type: boolean }
        kill: { type: boolean }
        reset: { type: boolean }
        gated: { type: boolean, description: "a real-money account: real trading needs the phase-7 gate" }
        forceClose: { type: boolean, description: "force close (admin, web session, trade access, demo account)" }
        forceCloseBlockedReason:
          type: string
          description: Why `forceClose` is false on a real-money account for a caller who could otherwise use it. Absent otherwise.
        startBlockedReason:
          type: string
          description: |
            Why `start` is false although the caller could otherwise start the agent: this
            process's agent loop is not running (still starting up, or the start-up resume
            failed and cactusTrade must be restarted). Absent when nothing blocks it.
    BlockedInstrument:
      type: object
      required: [instrumentId, symbol, reason, at]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        reason: { type: string }
        at: { type: string, format: date-time }
    FlattenTime:
      type: object
      required: [market, trading]
      properties:
        market: { $ref: "#/components/schemas/Market" }
        trading: { type: boolean, description: "the market trades today" }
        closes: { type: string, format: date-time }
        flattenAt: { type: string, format: date-time, description: "every position of this market is closed from then on" }
        note: { type: string }
    AgentLease:
      type: object
      required: [mine, other]
      description: Who may send orders for the account (one process at a time)
      properties:
        mine: { type: boolean, description: "this server holds it" }
        other: { type: boolean, description: "another process holds it: this server sends nothing" }
        expiresAt: { type: string, format: date-time }
    AgentPanel:
      type: object
      required: [account, state, reconciliation, limits, killed, dayStopped, riskDay, today, startOfDayEquityCents, highWaterMarkCents,
                 equityKnown, blocked, flatten, lease, controls, resetPhrase, openPositions, pendingOrders, missing]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        state: { $ref: "#/components/schemas/AgentState" }
        stateSince: { type: string, format: date-time, description: "when the agent entered this state; absent when unknown" }
        reconciliation: { $ref: "#/components/schemas/Reconciliation" }
        limits: { $ref: "#/components/schemas/RiskLimits" }
        killed: { type: boolean }
        killReason: { type: string }
        killedAt: { type: string, format: date-time }
        dayStopped: { type: boolean, description: "the daily floor was reached: no entries until the next risk day (22:00 UTC)" }
        riskDay: { type: string, description: "the risk day of the stored figures (empty = none yet)" }
        today: { type: string, description: "the current risk day" }
        startOfDayEquityCents: { $ref: "#/components/schemas/Cents" }
        highWaterMarkCents: { $ref: "#/components/schemas/Cents" }
        equityKnown: { type: boolean }
        equityCents: { $ref: "#/components/schemas/Cents" }
        equityError: { type: string }
        dailyFloorCents: { $ref: "#/components/schemas/Cents" }
        toDailyFloorCents: { $ref: "#/components/schemas/Cents" }
        drawdownFloorCents: { $ref: "#/components/schemas/Cents" }
        toDrawdownFloorCents: { $ref: "#/components/schemas/Cents" }
        blocked: { type: array, items: { $ref: "#/components/schemas/BlockedInstrument" } }
        flatten: { type: array, items: { $ref: "#/components/schemas/FlattenTime" } }
        lease: { $ref: "#/components/schemas/AgentLease" }
        controls: { $ref: "#/components/schemas/AgentControls" }
        resetPhrase: { type: string, description: "what an admin types to reset the kill switch" }
        openPositions: { type: integer, description: "positions cactusTrade opened that are open" }
        pendingOrders: { type: integer, description: "orders of ours that are not final" }
        missing:
          type: array
          description: "what must be set up before the agent can start (empty while it runs and on a real-money account)"
          items: { $ref: "#/components/schemas/MissingItem" }
    Order:
      type: object
      required: [requestId, mode, kind, kindLabel, direction, instrumentId, symbol, market, exchange, amountCents, state, stateLabel, reason, sends, createdAt, updatedAt]
      properties:
        requestId: { type: string, description: "our x-request-id, stored before the order is sent" }
        mode: { $ref: "#/components/schemas/TradingMode" }
        kind: { type: string, description: "open, close or cancel" }
        kindLabel: { type: string, description: "what the order is, worded by the server, e.g. \"Buy GOOG\", \"Cancel request for GOOG (buy order 396359836)\", \"Close request for GOOG (position 3649965576)\"" }
        direction: { type: string, description: "long, short or empty (cancel)" }
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        market: { type: string, description: "the exchange's calendar market of the order's share (LSE, NYSE, ASX); empty when the instrument is not cached" }
        exchange: { type: string, description: "the exchange named for people, e.g. Sydney (ASX); empty when unknown" }
        amountCents: { $ref: "#/components/schemas/Cents" }
        entry: { $ref: "#/components/schemas/Decimal" }
        stopLoss: { $ref: "#/components/schemas/Decimal" }
        takeProfit: { $ref: "#/components/schemas/Decimal" }
        positionId: { type: integer, format: int64 }
        etoroOrderId: { type: integer, format: int64 }
        state: { type: string, description: "created, sent, pending, filled, partially_filled, rejected, cancelled, unknown or abandoned" }
        stateLabel: { type: string, description: "the state worded by the server: an open reads filled / partially filled; a cancel eToro took reads accepted by eToro, a close done (partly done); a refused cancel or close reads refused; otherwise the state's name" }
        reason: { type: string, description: "why the order is in its state, worded by the server; a cancel says what was asked of eToro, why cactusTrade asked, and that an accepted cancel does not mean the order was cancelled" }
        sends: { type: integer }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UsdCost:
      type: string
      pattern: '^[0-9]+(\.[0-9]{1,6})?$'
      description: US dollars to the micro-dollar (absent = unknown, OD13)
    Decision:
      type: object
      description: One candidate the agent handled (PLAN 5.5)
      required: [id, accountId, at, instrumentId, symbol, direction, playbook, signalReason, entry, stopLoss, suggestedSizeCents, regimeProbs, verdict, sizeBp, verdictReason, llmCallId, riskAllowed, riskSizeCents, riskReason, outcome, orderRequestId, orderState]
      properties:
        id: { type: string }
        accountId: { type: string }
        at: { type: string, format: date-time }
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        direction: { type: string, description: "long or short" }
        playbook: { type: string }
        signalReason: { type: string }
        entry: { $ref: "#/components/schemas/Decimal" }
        stopLoss: { $ref: "#/components/schemas/Decimal" }
        takeProfit: { $ref: "#/components/schemas/Decimal" }
        suggestedSizeCents: { $ref: "#/components/schemas/Cents" }
        regimeProbs:
          type: object
          description: the regime model's probabilities (regime → 0..1)
          additionalProperties: { type: number, format: double }
        verdict: { type: string, description: "approve, reduce, reject or empty (not reviewed: reviewing off, or ended before the review)" }
        sizeBp: { type: integer, description: "the size the reviewer left, in basis points of the proposed size" }
        verdictReason: { type: string }
        llmCallId: { type: string, description: "the logged reviewer call (empty = none)" }
        riskAllowed: { type: boolean }
        riskSizeCents: { $ref: "#/components/schemas/Cents" }
        riskReason: { type: string, description: "the risk engine's answer, or why the candidate ended before or after it" }
        outcome: { type: string, description: "pending, rejected_reviewer, rejected_cost, rejected_risk, ordered or order_failed" }
        orderRequestId: { type: string, description: "the order's x-request-id (empty = no order)" }
        orderState: { type: string, description: "the order's state now (empty = no order)" }
    LlmCall:
      type: object
      description: One call to an LLM reviewer as sent and received (never a key or a header)
      required: [id, purpose, profileId, provider, model, prompt, response, inputTokens, outputTokens, latencyMs, error, at]
      properties:
        id: { type: string }
        purpose: { type: string, description: "agent, scanner or test" }
        profileId: { type: string }
        provider: { type: string }
        model: { type: string, description: "the model that answered" }
        prompt: { type: string, description: "the request body as sent (cut at 32 KiB)" }
        response: { type: string, description: "the raw response body (cut at 32 KiB)" }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        latencyMs: { type: integer, format: int64 }
        costUsd: { $ref: "#/components/schemas/UsdCost" }
        error: { type: string }
        at: { type: string, format: date-time }
    DecisionDetail:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/Decision" }
        call: { $ref: "#/components/schemas/LlmCall" }
    LlmUsageRow:
      type: object
      required: [profileId, profileName, purpose, calls, failed, inputTokens, outputTokens, knownCostUsd, costUnknownCalls]
      properties:
        profileId: { type: string }
        profileName: { type: string, description: "empty when the profile was deleted" }
        purpose: { type: string, description: "agent, scanner or test (empty in the total)" }
        calls: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        knownCostUsd: { $ref: "#/components/schemas/UsdCost" }
        costUnknownCalls: { type: integer, format: int64, description: "calls without a price (their cost is unknown; knownCostUsd leaves them out)" }
        costUsd: { $ref: "#/components/schemas/UsdCost" }
    LlmUsage:
      type: object
      required: [days, since, rows, total]
      properties:
        days: { type: integer }
        since: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: "#/components/schemas/LlmUsageRow" }
        total: { $ref: "#/components/schemas/LlmUsageRow" }
    HistoryTrade:
      type: object
      description: One closed trade as eToro reported it (PLAN 6.4)
      required: [positionId, instrumentId, symbol, direction, leverage, units, investedCents, openRate, closeRate, netProfitCents, feesKnown, openedAt, closedAt, ours, openRequestId, etoroOrderId, mode]
      properties:
        positionId: { type: integer, format: int64 }
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string, description: "empty when the instrument is not cached" }
        direction: { type: string, description: "long or short" }
        leverage: { type: integer }
        units: { $ref: "#/components/schemas/Decimal" }
        investedCents: { $ref: "#/components/schemas/Cents" }
        openRate: { $ref: "#/components/schemas/Decimal" }
        closeRate: { $ref: "#/components/schemas/Decimal" }
        stopLoss: { $ref: "#/components/schemas/Decimal" }
        takeProfit: { $ref: "#/components/schemas/Decimal" }
        netProfitCents: { $ref: "#/components/schemas/Cents" }
        feesCents: { $ref: "#/components/schemas/Cents" }
        feesKnown: { type: boolean, description: "false when eToro did not report the fees (feesCents is then absent, never 0)" }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        ours: { type: boolean, description: "cactusTrade opened the position (OD1)" }
        openRequestId: { type: string, description: "the x-request-id of our open order (empty when not ours)" }
        etoroOrderId: { type: integer, format: int64, description: "eToro's order id of the open (0 = not reported)" }
        mode: { $ref: "#/components/schemas/TradingMode" }
    HistoryDrawdown:
      type: object
      description: The account's equity drawdown over its snapshots in the period (known false = no snapshot)
      required: [known, peakCents, maxDrawdownCents, maxDrawdownBp, currentCents, currentBp]
      properties:
        known: { type: boolean }
        peakCents: { $ref: "#/components/schemas/Cents" }
        peakAt: { type: string, format: date-time }
        maxDrawdownCents: { $ref: "#/components/schemas/Cents" }
        maxDrawdownBp: { type: integer, format: int64 }
        currentCents: { $ref: "#/components/schemas/Cents" }
        currentBp: { type: integer, format: int64 }
    HistorySummary:
      type: object
      required: [accountId, days, from, to, trades, wins, losses, breakeven, grossCents, feesCents, netCents, feesUnknownTrades, foreignTrades, drawdown]
      properties:
        accountId: { type: string }
        days: { type: integer }
        from: { type: string, format: date-time, description: "the start of the first risk day" }
        to: { type: string, format: date-time }
        trades: { type: integer, description: "cactusTrade's closed trades in the period" }
        wins: { type: integer }
        losses: { type: integer }
        breakeven: { type: integer }
        winRateBp: { type: integer, format: int64, description: "wins / trades in basis points (absent when there are no trades)" }
        grossCents: { $ref: "#/components/schemas/Cents" }
        feesCents: { $ref: "#/components/schemas/Cents" }
        netCents: { $ref: "#/components/schemas/Cents" }
        feesUnknownTrades: { type: integer, description: "trades whose fees eToro did not report (in neither fees nor gross)" }
        foreignTrades: { type: integer, description: "closed trades of positions cactusTrade did not open (not counted above)" }
        drawdown: { $ref: "#/components/schemas/HistoryDrawdown" }
    HistoryDay:
      type: object
      required: [day, trades, realisedCents, feesCents, feesUnknownTrades]
      properties:
        day: { type: string, description: "the risk day (YYYY-MM-DD, starting 22:00 UTC the day before)" }
        trades: { type: integer }
        realisedCents: { $ref: "#/components/schemas/Cents" }
        feesCents: { $ref: "#/components/schemas/Cents" }
        feesUnknownTrades: { type: integer }
        equityEndCents: { $ref: "#/components/schemas/Cents" }
        equityChangeCents:
          allOf: [{ $ref: "#/components/schemas/Cents" }]
          description: "the change of the account's equity that day; it includes deposits, withdrawals and positions not opened by cactusTrade (absent = no snapshot)"
    DailyHistory:
      type: object
      required: [accountId, days, from, to, rows]
      properties:
        accountId: { type: string }
        days: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: "#/components/schemas/HistoryDay" }
    LiveMarketClock:
      type: object
      required: [market, trading, toNoEntrySeconds, toFlattenSeconds]
      properties:
        market: { $ref: "#/components/schemas/Market" }
        trading: { type: boolean, description: "the market trades today" }
        opens: { type: string, format: date-time }
        closes: { type: string, format: date-time }
        noEntryAt: { type: string, format: date-time, description: "no new entries from then on" }
        flattenAt: { type: string, format: date-time, description: "cactusTrade's positions of this market are closed from then on" }
        toNoEntrySeconds: { type: integer, format: int64, description: "seconds until noEntryAt (0 = passed or not trading)" }
        toFlattenSeconds: { type: integer, format: int64, description: "seconds until flattenAt (0 = passed or not trading)" }
    LiveFigures:
      type: object
      description: |
        The account's figures and its distance to every limit the risk engine applies, from
        the cached portfolio (`asOf`). Distances are the amounts left before a limit refuses
        an entry; a distance at or below 0 means no new entry.
      required: [asOf, equityCents, cashCents, reservedCents, cashLeftCents, budgetCents, budgetUsedCents, budgetLeftCents,
                 dayKnown, day, startOfDayCents, dayPnlCents, dailyFloorCents, toDailyFloorCents, dayStopped,
                 highWaterMarkCents, drawdownFloorCents, toDrawdownFloorCents, killed, open, cap, slotsLeft,
                 shortUsedCents, shortCapCents, shortLeftCents, markets]
      properties:
        asOf: { type: string, format: date-time }
        equityCents: { $ref: "#/components/schemas/Cents" }
        cashCents: { $ref: "#/components/schemas/Cents" }
        reservedCents: { $ref: "#/components/schemas/Cents" }
        cashLeftCents: { $ref: "#/components/schemas/Cents" }
        budgetCents: { $ref: "#/components/schemas/Cents" }
        budgetUsedCents: { $ref: "#/components/schemas/Cents" }
        budgetLeftCents: { $ref: "#/components/schemas/Cents" }
        dayKnown: { type: boolean, description: "the day figures (start of day, day P&L, daily floor) are today's" }
        day: { type: string, description: "today's risk day (22:00 UTC boundary)" }
        startOfDayCents: { $ref: "#/components/schemas/Cents" }
        dayPnlCents: { $ref: "#/components/schemas/Cents" }
        dailyFloorCents: { $ref: "#/components/schemas/Cents" }
        toDailyFloorCents: { $ref: "#/components/schemas/Cents" }
        dayStopped: { type: boolean }
        highWaterMarkCents: { $ref: "#/components/schemas/Cents" }
        drawdownFloorCents: { $ref: "#/components/schemas/Cents" }
        toDrawdownFloorCents: { $ref: "#/components/schemas/Cents" }
        killed: { type: boolean }
        open: { type: integer, description: "open positions plus our unfinished open orders" }
        cap: { type: integer, description: "the position cap" }
        slotsLeft: { type: integer }
        shortUsedCents: { $ref: "#/components/schemas/Cents" }
        shortCapCents: { $ref: "#/components/schemas/Cents" }
        shortLeftCents: { $ref: "#/components/schemas/Cents" }
        markets:
          type: array
          items: { $ref: "#/components/schemas/LiveMarketClock" }
    LivePosition:
      type: object
      required: [positionId, instrumentId, symbol, market, openedAt, openRate, units, amountCents, unrealisedPnlCents, realAsset, long, leverage, ours]
      properties:
        positionId: { type: integer, format: int64 }
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string, description: "empty when the instrument is not cached" }
        market: { $ref: "#/components/schemas/Market" }
        openedAt: { type: string, format: date-time }
        openRate: { $ref: "#/components/schemas/Decimal" }
        units: { $ref: "#/components/schemas/Decimal" }
        amountCents: { $ref: "#/components/schemas/Cents" }
        unrealisedPnlCents: { $ref: "#/components/schemas/Cents" }
        stopLossRate: { $ref: "#/components/schemas/Decimal" }
        takeProfitRate: { $ref: "#/components/schemas/Decimal" }
        realAsset: { type: boolean }
        long: { type: boolean }
        leverage: { type: integer }
        ours: { type: boolean, description: "cactusTrade opened it (only these are ever closed by cactusTrade)" }
        openRequestId: { type: string, description: "the x-request-id of our open order" }
        flattenAt: { type: string, format: date-time, description: "when cactusTrade closes it today (ours only)" }
    LiveRegime:
      type: object
      required: [instrumentId, symbol, known]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        known: { type: boolean, description: "a review with regime probabilities exists" }
        regime: { type: string, description: "the most likely regime of the latest review" }
        probabilities:
          type: object
          description: the regime model's probabilities (regime → 0..1)
          additionalProperties: { type: number, format: double }
        at: { type: string, format: date-time }
        mood: { $ref: "#/components/schemas/RegimeText" }
        stance:
          type: string
          description: which playbooks may act at the account's current thresholds
          enum: [stay_out, trend, reversion, both, wait, unknown]
        mayDo: { type: string, description: "what the agent may do, in plain words" }
    RegimeText:
      type: object
      description: A market mood (regime) for people
      required: [regime, label, description, agentMayDo]
      properties:
        regime: { type: string }
        label: { type: string }
        description: { type: string }
        agentMayDo: { type: string }
    LiveSnapshot:
      type: object
      description: An account's live view (the `snapshot` message of GET /api/v1/live)
      required: [account, at, portfolioKnown, stale, positions, openOrders, recentOrders, regimes, state, reconciliation, killed, dayStopped, lease]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        at: { type: string, format: date-time, description: "when the snapshot was built" }
        portfolioKnown: { type: boolean, description: "a cached portfolio exists; figures and positions need one" }
        portfolioAt: { type: string, format: date-time }
        stale: { type: boolean, description: "no portfolio, or one older than 30 seconds" }
        figures: { $ref: "#/components/schemas/LiveFigures" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/LivePosition" }
        openOrders:
          type: array
          description: our orders that are not final, oldest first
          items: { $ref: "#/components/schemas/Order" }
        recentOrders:
          type: array
          description: the latest 20 orders, newest first
          items: { $ref: "#/components/schemas/Order" }
        regimes:
          type: array
          items: { $ref: "#/components/schemas/LiveRegime" }
        regimeLegend:
          type: array
          description: the market moods explained (R28)
          items: { $ref: "#/components/schemas/RegimeText" }
        state: { $ref: "#/components/schemas/AgentState" }
        reconciliation: { $ref: "#/components/schemas/Reconciliation" }
        killed: { type: boolean }
        killReason: { type: string }
        dayStopped: { type: boolean }
        lease: { $ref: "#/components/schemas/AgentLease" }
    LiveEvent:
      type: object
      description: A new event of the feed (the `event` message)
      required: [accountId, event]
      properties:
        accountId: { type: string, description: "the account it is about (empty = system-wide)" }
        event: { $ref: "#/components/schemas/Event" }
    LiveTick:
      type: object
      description: One agent decision round on an account (the `tick` message; not stored)
      required: [accountId, at, checked, ideas, orders, skipped, reasons, shares, killed, errors]
      properties:
        accountId: { type: string }
        at: { type: string, format: date-time, description: "when the round started" }
        checked: { type: integer, description: "watchlist shares looked at" }
        ideas: { type: integer, description: "candidates the strategy proposed (one decision each)" }
        orders: { type: integer, description: "orders sent" }
        skipped: { type: string, description: "why the round did nothing (empty = it ran)" }
        reasons:
          type: object
          description: "shares that led to no order, by the step that stopped them (session, candles, signal, costs, review, prices, reservations, risk, order)"
          additionalProperties: { type: integer }
        shares:
          type: array
          items: { $ref: "#/components/schemas/LiveTickShare" }
        killed: { type: boolean, description: "the round tripped the kill switch" }
        errors: { type: integer, description: "errors the round met" }
    LiveTickShare:
      type: object
      description: What one round did with one share
      required: [instrumentId, symbol, entered, step, detail]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        entered: { type: boolean, description: "an order was sent" }
        step: { type: string, description: "the step that stopped it (empty when entered)" }
        detail: { type: string, description: "the last step's answer (at most 200 characters)" }
    LiveDecision:
      type: object
      description: A decision of the agent with its outcome (the `decision` message)
      required: [accountId, decision]
      properties:
        accountId: { type: string }
        decision: { $ref: "#/components/schemas/Decision" }
    LiveOrder:
      type: object
      description: One of cactusTrade's orders as just stored (the `order` message)
      required: [accountId, order]
      properties:
        accountId: { type: string }
        order: { $ref: "#/components/schemas/Order" }
    LiveNotice:
      type: object
      description: Why the server sent `resync` or `bye`
      required: [reason]
      properties:
        reason: { type: string, description: "resync: behind; bye: signed_out, no_access, unavailable (the check could not be made), lifetime or shutdown" }
    StatementPeriod:
      type: string
      enum: [daily, weekly, monthly]
      description: "daily: one risk day (sent 22:30 UTC, Monday to Friday); weekly: Monday to Friday (sent Saturday 06:00 UTC); monthly: a calendar month (sent the 1st, 06:00 UTC)"
    StatementScope:
      type: string
      enum: [combined, account, exchange]
    StatementAccountRef:
      type: object
      required: [id, name, platform, mode]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        mode: { $ref: "#/components/schemas/TradingMode" }
    StatementScheduleInput:
      type: object
      required: [period, accountIds, recipients, includeCombined, includeAccounts, includeExchanges, enabled]
      properties:
        period: { $ref: "#/components/schemas/StatementPeriod" }
        accountIds:
          type: array
          maxItems: 50
          description: The accounts (none = every account the owner may put on a schedule)
          items: { type: string, maxLength: 64 }
        recipients:
          type: array
          maxItems: 10
          description: 1 to 10 e-mail addresses
          items: { type: string, maxLength: 254 }
        includeCombined: { type: boolean, description: "the combined statement of every account and exchange" }
        includeAccounts: { type: boolean, description: "one statement per account" }
        includeExchanges: { type: boolean, description: "one statement per exchange with trades or positions" }
        enabled: { type: boolean }
    StatementSchedule:
      type: object
      required: [id, ownerId, ownerName, period, accountIds, accounts, recipients, includeCombined, includeAccounts, includeExchanges, enabled, lastPeriod, lastError, createdAt, updatedAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        period: { $ref: "#/components/schemas/StatementPeriod" }
        accountIds: { type: array, items: { type: string } }
        accounts:
          type: array
          description: The accounts the statements cover now
          items: { $ref: "#/components/schemas/StatementAccountRef" }
        recipients: { type: array, items: { type: string } }
        includeCombined: { type: boolean }
        includeAccounts: { type: boolean }
        includeExchanges: { type: boolean }
        enabled: { type: boolean }
        lastPeriod: { type: string, description: "the newest period handled (e.g. 2026-11-24, 2026-W48, 2026-11)" }
        lastSentAt: { type: string, format: date-time, description: "when a scheduled statement was last sent (absent = never)" }
        lastError: { type: string, description: "why the last scheduled send failed (empty = it did not)" }
        nextSendAt: { type: string, format: date-time, description: "absent when switched off" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StatementsPage:
      type: object
      required: [schedules, accounts, mailServer, canFixMail]
      properties:
        schedules: { type: array, items: { $ref: "#/components/schemas/StatementSchedule" } }
        accounts:
          type: array
          description: The accounts the caller may put on a schedule
          items: { $ref: "#/components/schemas/StatementAccountRef" }
        mailServer: { type: boolean, description: "a mail server is set up (else e-mails wait in the outbox)" }
        canFixMail: { type: boolean, description: "the caller may set one up (E-mail page)" }
    StatementSendResult:
      type: object
      required: [period, from, to, title, recipients, files]
      properties:
        period: { type: string, description: "the period's key" }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        title: { type: string }
        recipients: { type: integer, description: "e-mails queued" }
        files: { type: array, items: { type: string } }
    AnalysisPreset:
      type: string
      enum: [today, week, month, last_month, custom, all]
      description: "today: today's risk day; week: Monday to Friday of this ISO week; month / last_month: a calendar month; custom: from–to; all: the last 400 risk days"
    AnalysisBucket:
      type: string
      enum: [day, week, month]
    AnalysisDimension:
      type: string
      enum: [date, exchange, account, theme, direction, playbook, outcome]
    AnalysisAccount:
      type: object
      required: [id, name, platform, mode, viewOnly]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string, description: "the platform's name (eToro, Trading 212 …)" }
        mode: { $ref: "#/components/schemas/TradingMode" }
        viewOnly: { type: boolean }
    AnalysisTrade:
      type: object
      required: [account, symbol, positionId, closedAt, netCents]
      properties:
        account: { type: string }
        symbol: { type: string, description: "empty when the share is not cached" }
        positionId: { type: integer, format: int64 }
        closedAt: { type: string, format: date-time }
        netCents: { $ref: "#/components/schemas/Cents" }
    AnalysisTradeRow:
      type: object
      description: One closed trade of the period, as the analysis drills into it (US dollars)
      required: [accountId, account, positionId, symbol, exchange, theme, playbook, direction, openedAt, closedAt, investmentCents, netCents, feesCents, feesKnown, outcome, ours]
      properties:
        accountId: { type: string }
        account: { type: string }
        positionId: { type: integer, format: int64 }
        symbol: { type: string, description: "empty when the share is not cached" }
        exchange: { type: string, description: "LSE, NYSE, ASX or Other" }
        theme: { type: string }
        playbook: { type: string }
        direction: { type: string, enum: [long, short] }
        openedAt: { type: string, format: date-time, description: "absent time (zero) when eToro did not report it" }
        closedAt: { type: string, format: date-time }
        openRate: { $ref: "#/components/schemas/Decimal" }
        closeRate: { $ref: "#/components/schemas/Decimal" }
        investmentCents: { $ref: "#/components/schemas/Cents" }
        netCents: { $ref: "#/components/schemas/Cents" }
        feesCents: { $ref: "#/components/schemas/Cents" }
        feesKnown: { type: boolean, description: "false when eToro did not report the fees (feesCents is then 0, not counted)" }
        outcome: { type: string, enum: [Win, Loss, Breakeven] }
        ours: { type: boolean, description: "cactusTrade opened the position (only these are counted in the figures)" }
    AnalysisGroup:
      type: object
      description: The figures of one group of cactusTrade's closed trades (US dollars)
      required: [key, label, trades, wins, losses, breakeven, grossCents, feesCents, netCents, feesUnknownTrades]
      properties:
        key: { type: string }
        label: { type: string }
        trades: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        breakeven: { type: integer }
        winRateBp: { type: integer, format: int64, description: "wins / trades in basis points (absent when there are no trades)" }
        grossCents: { $ref: "#/components/schemas/Cents" }
        feesCents: { $ref: "#/components/schemas/Cents" }
        netCents: { $ref: "#/components/schemas/Cents" }
        feesUnknownTrades: { type: integer, description: "trades whose fees eToro did not report (in neither fees nor gross)" }
        avgNetCents:
          allOf: [{ $ref: "#/components/schemas/Cents" }]
          description: "realised P&L per trade (absent when there are no trades)"
        best: { $ref: "#/components/schemas/AnalysisTrade" }
        worst: { $ref: "#/components/schemas/AnalysisTrade" }
    AnalysisGrouping:
      type: object
      required: [dimension, title, groups]
      properties:
        dimension: { $ref: "#/components/schemas/AnalysisDimension" }
        title: { type: string }
        groups: { type: array, items: { $ref: "#/components/schemas/AnalysisGroup" } }
    AnalysisEquity:
      type: object
      description: One account's first and last snapshot in the period (minor units of its currency)
      required: [account, currency, known, openingMinor, closingMinor, changeMinor, maxDrawdownMinor, maxDrawdownBp, viewOnly]
      properties:
        account: { type: string }
        currency: { type: string }
        known: { type: boolean, description: "a snapshot was recorded in the period" }
        openingMinor: { $ref: "#/components/schemas/MinorUnits" }
        closingMinor: { $ref: "#/components/schemas/MinorUnits" }
        changeMinor: { $ref: "#/components/schemas/MinorUnits" }
        maxDrawdownMinor: { $ref: "#/components/schemas/MinorUnits" }
        maxDrawdownBp: { type: integer, format: int64 }
        viewOnly: { type: boolean }
    AnalysisEquityTotal:
      type: object
      description: The accounts of one currency added up (never across currencies)
      required: [currency, accounts, openingMinor, closingMinor, changeMinor]
      properties:
        currency: { type: string }
        accounts: { type: integer }
        openingMinor: { $ref: "#/components/schemas/MinorUnits" }
        closingMinor: { $ref: "#/components/schemas/MinorUnits" }
        changeMinor: { $ref: "#/components/schemas/MinorUnits" }
    AnalysisPoint:
      type: object
      required: [at, equity]
      properties:
        at: { type: string, format: date-time }
        equity: { $ref: "#/components/schemas/MinorUnits" }
    AnalysisCurve:
      type: object
      description: The recorded equity of the accounts of one currency (each account joins at its first snapshot)
      required: [currency, accounts, points, maxDrawdownMinor, maxDrawdownBp]
      properties:
        currency: { type: string }
        accounts: { type: integer }
        points: { type: array, items: { $ref: "#/components/schemas/AnalysisPoint" } }
        maxDrawdownMinor: { $ref: "#/components/schemas/MinorUnits" }
        maxDrawdownBp: { type: integer, format: int64 }
    AnalysisRisk:
      type: object
      required: [killSwitches, killResets, dailyStops, limitChanges, forceCloses, riskRefusals]
      properties:
        killSwitches: { type: integer }
        killResets: { type: integer }
        dailyStops: { type: integer, description: "the daily loss limit stopped new entries" }
        limitChanges: { type: integer }
        forceCloses: { type: integer }
        riskRefusals: { type: integer, description: "candidates the risk engine refused" }
    AnalysisCount:
      type: object
      required: [label, n]
      properties:
        label: { type: string }
        n: { type: integer }
    AnalysisLlm:
      type: object
      required: [calls, failed, inputTokens, outputTokens, knownCostUsd, costUnknownCalls]
      properties:
        calls: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        knownCostUsd: { $ref: "#/components/schemas/UsdCost" }
        costUnknownCalls: { type: integer, format: int64, description: "calls without a price (not in knownCostUsd)" }
    AnalysisSection:
      type: object
      required: [heading, paragraphs]
      properties:
        heading: { type: string }
        paragraphs: { type: array, items: { type: string } }
    Analysis:
      type: object
      description: |
        An analysis of a period (R31). Trade figures are cactusTrade's own closed trades in US
        dollars after the fees eToro reported; equity is per currency and never added across
        currencies. Figures describe past results only.
      required: [preset, from, to, firstDay, lastDay, days, bucket, title, generatedAt, allAccounts, scope, accounts, totals, foreignTrades, tradeAccounts, groupings, equity, equityTotals, curves, risk, decisions, decisionsTotal, verdicts, llm, activityCapped, narrative, notes, trades, tradesCapped]
      properties:
        preset: { $ref: "#/components/schemas/AnalysisPreset" }
        from: { type: string, format: date-time, description: "the start of the first risk day" }
        to: { type: string, format: date-time, description: "the end of the last risk day (exclusive)" }
        firstDay: { type: string }
        lastDay: { type: string }
        days: { type: integer }
        bucket: { $ref: "#/components/schemas/AnalysisBucket" }
        title: { type: string }
        generatedAt: { type: string, format: date-time }
        allAccounts: { type: boolean, description: "no account was chosen: every account you can see" }
        scope: { type: string }
        accounts: { type: array, items: { $ref: "#/components/schemas/AnalysisAccount" } }
        totals: { $ref: "#/components/schemas/AnalysisGroup" }
        foreignTrades: { type: integer, description: "closed trades of positions cactusTrade did not open (not counted)" }
        oursShareBp: { type: integer, format: int64, description: "cactusTrade's share of all closed trades in basis points (absent when there were none)" }
        tradeAccounts: { type: integer }
        groupings: { type: array, items: { $ref: "#/components/schemas/AnalysisGrouping" } }
        equity: { type: array, items: { $ref: "#/components/schemas/AnalysisEquity" } }
        equityTotals: { type: array, items: { $ref: "#/components/schemas/AnalysisEquityTotal" } }
        curves: { type: array, items: { $ref: "#/components/schemas/AnalysisCurve" } }
        risk: { $ref: "#/components/schemas/AnalysisRisk" }
        decisions: { type: array, items: { $ref: "#/components/schemas/AnalysisCount" } }
        decisionsTotal: { type: integer }
        verdicts: { type: array, items: { $ref: "#/components/schemas/AnalysisCount" } }
        llm: { $ref: "#/components/schemas/AnalysisLlm" }
        activityCapped: { type: boolean, description: "some activity counts are lower bounds" }
        narrative: { type: array, items: { $ref: "#/components/schemas/AnalysisSection" } }
        notes: { type: array, items: { type: string } }
        trades:
          type: array
          description: "the period's closed trades behind the figures, newest first (at most 2,000): cactusTrade's own and, flagged ours false and never counted, the others (R35)"
          items: { $ref: "#/components/schemas/AnalysisTradeRow" }
        tradesCapped: { type: boolean, description: "more trades closed in the period than are listed" }
