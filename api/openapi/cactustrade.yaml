        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/broker/test:
    post:
      tags: [broker]
      operationId: testBrokerConnection
      summary: Test the eToro connection with the current mode's keys (admin; one read-only call)
