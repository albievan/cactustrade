      responses:
        "204": { description: Reloaded }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/system/restart:
    post:
      tags: [system]
      operationId: restartServer
      summary: Restart cactusTrade gracefully (admin, web UI)
      responses:
        "202": { description: Restarting; the page reconnects when it is back }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: The newest events and the caller's unread count (viewer)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventFeed" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/events/seen:
    post:
      tags: [events]
      operationId: markEventsSeen
      summary: Mark every event as seen by the caller
      responses:
        "204": { description: Marked }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/risk/limits:
    get:
      tags: [risk]
      operationId: getRiskLimits
      summary: The risk limits (viewer)
      description: |
        The current account's limits, and whether the caller may change them now (`canEdit`,
        decided by the same rules as the PUT: the account's owner, in a web session, with the
        agent stopped and the kill switch off). When not, `editBlockedReason` says why. The
        UI only shows these.
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskLimitsView" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [risk]
      operationId: setRiskLimits
      summary: Change the risk limits (owner, web UI, only while the agent is stopped)
      description: |
        Either `{preset}` alone (R28: the preset's limits; the trading budget is kept, the
        windows before the close are never shortened, and on a real-money account every
        value is capped at the real ceilings) or every limit (a custom set). The same rules
        apply to both: the account's owner, a web session, the agent stopped, no kill switch,
        the budget at most the equity; raising any limit of an armed real-money account
        disarms it. The answer names the preset the stored limits match, or `custom`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskLimitsChange" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskLimitsView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/risk/presets:
    get:
      tags: [risk]
      operationId: getRiskPresets
      summary: The risk presets for the current account (viewer)
      description: |
        Each preset's limits in plain words, as the current account would get them (capped at
        the real ceilings on a real-money account, `clamped`), and the preset its limits match
        now (`current`, or `custom`).
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskPresetList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/risk/minimums:
    get:
      tags: [risk]
      operationId: getTradeMinimums
      summary: The trade minimums of the current account's platform, checked against its limits (viewer)
      description: |
        The latest check (R38): eToro's smallest long and short (from the eligibility of the
        watched shares), what the limits allow now, and the changes proposed so that a trade of
        the minimum size fits. Nothing changes until the owner approves (`canDecide`, by the
        rules of a change of limits; `decideHint` says why not). No `review` before the first
        check.
      responses:
        "200":
          description: Minimums
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeMinimumsView" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/risk/minimums/check:
    post:
      tags: [risk]
      operationId: checkTradeMinimums
      summary: Check the platform's trade minimums against the limits now (owner)
      description: Reads eToro's equity, works out the minimums and the proposal, and stores the check (replacing an undecided one). It changes no limit; new eToro keys run it too.
      responses:
        "200":
          description: Checked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeMinimumsView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/risk/minimums/{reviewId}/decision:
    parameters:
      - { name: reviewId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    post:
      tags: [risk]
      operationId: decideTradeMinimums
      summary: Approve or decline the proposed limits (owner, web UI, agent stopped)
      description: |
        Approving changes the limits to the proposal through the same rules as PUT
        /risk/limits (owner, web session, agent stopped, no kill switch, budget at most the
        equity; audited). Refused (409) when the limits changed since the check or the check
        is already decided. Declining changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeMinimumsView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/agent:
    get:
      tags: [agent]
      operationId: getAgent
      summary: The agent of an account — state, reconciliation, kill switch, distance to the limits (viewer)
      description: |
        Reads the account's portfolio once (read-only) for the equity; when that fails the
        figures that need it are left out and `equityError` says why. `controls` lists the
        actions the caller may take (the server decides; the UI only shows them). On a real
        account (`controls.gated`) nothing can be started until the phase-7 gate.
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPanel" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/agent/style:
    get:
      tags: [agent]
      operationId: getAgentStyle
      summary: The current account's aggressiveness and autonomy (viewer)
      description: |
        The aggressiveness the owner chose and the one the strategy uses now (full autonomy
        lowers it one step after a day that reached the daily loss limit), the autonomy level
        and what it lets the platform do, each level explained in plain words, and whether the
        caller may change them now (the rules of the risk limits).
      responses:
        "200":
          description: Style
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStyle" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [agent]
      operationId: setAgentStyle
      summary: Change the aggressiveness and/or autonomy (owner, web UI, only while the agent is stopped)
      description: |
        Neither changes a risk limit: the aggressiveness tunes the strategy inside the limits
        (the risk engine still sizes and refuses every entry) and autonomy decides what the
        scanner, the research and the start at the market open may do. Audited, with an event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentStyleChange" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStyle" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/agents:
    get:
      tags: [agent]
      operationId: listAgents
      summary: The agent of every eToro account the caller can see, with the caller's controls (viewer)
      description: |
        One card per account for the Risk limits page (R23): state, kill switch,
        reconciliation, whether the caller may change its limits now, and `controls` decided
