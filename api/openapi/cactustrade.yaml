        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist:
    get:
      tags: [market]
      operationId: listWatchlist
      summary: The instruments the agent may trade (viewer)
      responses:
        "200":
          description: Watchlist, by symbol
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WatchItem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [market]
      operationId: addToWatchlist
      summary: Add a share after eToro confirms it can be bought as a real share at leverage 1 (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddWatchRequest" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchItem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist/counts:
    get:
      tags: [market]
      operationId: listWatchlistCounts
      summary: How many shares the watchlist of each eToro account the caller can see holds (viewer)
      description: |
        Lets an empty watchlist page name the caller's accounts that do have shares (R25).
        Accounts the caller cannot see (not owned, not shared) are never counted.
      responses:
        "200":
          description: One row per eToro account, in the accounts list's order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WatchlistCount" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist/quotes:
    get:
      tags: [market]
      operationId: listWatchlistQuotes
      summary: Current bid/ask of the watchlist (viewer)
      responses:
        "200":
          description: Quotes (instruments without a price are left out)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Quote" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist/overview:
    get:
      tags: [market]
      operationId: getWatchlistOverview
      summary: Whether the caller may edit the watchlist and what the account holds (viewer)
      description: |
        R27. canEdit says whether the caller has trade access to the current account (themes,
        auto-assign, import, export); the page only shows it. holdings come from the portfolio
        view cache (PLAN 6.6a): at most one eToro read per account every 10 s, shared with
        every other view, never used for trading.
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistOverview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist/theme-assignments:
    post:
      tags: [market]
      operationId: assignWatchlistThemes
      summary: Put watchlist shares into themes (trade access)
      description: |
        One theme per watchlist share (R27-a): the share is added to the chosen theme's picked
        shares and removed from every other theme of the account; an empty themeId removes it
        from all of them. Everything is checked before anything is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemeAssignmentsRequest" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeAssignmentsResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist/theme-proposals:
    get:
      tags: [market]
      operationId: proposeWatchlistThemes
      summary: Propose the closest theme for each watchlist share without one (trade access; changes nothing)
      description: |
        Deterministic scoring, no LLM (R27-c): a search word that is the symbol 5, starts a
        word of the name 3, starts a word of the industry name 2; the theme's eToro industry
        4. Ties go to the theme whose name sorts first. Reads eToro's industries (one screen
        per theme industry, read-only market data); when that fails the industry is not
        scored and a note says so.
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeProposals" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist/export:
    get:
      tags: [market]
      operationId: exportWatchlist
      summary: Download the watchlist and themes as JSON (trade access)
      description: No secrets, no account ids; LLM profiles by name only.
      responses:
        "200":
          description: The file (Content-Disposition attachment)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistFile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist/import:
    post:
      tags: [market]
      operationId: importWatchlist
      summary: Merge a watchlist file into the current account (trade access, web UI)
      description: |
        At most 1 MiB, version 1, at most 200 shares and 50 themes. Every share goes through
        the same eToro check as adding by hand; refused ones are reported, not added. A theme
        with the same name (case-insensitive) is updated, any other created. Importing the
        same file twice changes nothing the second time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchlistFile" }
      responses:
        "200":
          description: What was merged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistImportResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/watchlist/{instrumentId}:
    parameters:
      - { name: instrumentId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    delete:
      tags: [market]
      operationId: removeFromWatchlist
      summary: Remove an instrument (admin)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
