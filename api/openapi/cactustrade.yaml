          application/json:
            schema: { $ref: "#/components/schemas/LlmProfileInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/llm/profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    put:
      tags: [llm]
      operationId: updateLlmProfile
      summary: Change a reviewer profile (admin, web UI). apiKey absent keeps the stored key, "" removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmProfileInput" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [llm]
      operationId: deleteLlmProfile
      summary: Delete a reviewer profile and its key (admin, web UI); deleting the active one switches reviewing off
      responses:
