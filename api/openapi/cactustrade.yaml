            application/json:
              schema:
                type: array
                items: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/llm/usage:
    get:
      tags: [llm]
      operationId: getLlmUsage
      summary: LLM calls of the last days per profile and purpose, with tokens and cost (admin)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 400, default: 30 } }
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmUsage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Newest audit entries (admin)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cactustrade_session
    bearerApiKey:
      type: http
      scheme: bearer
      description: "API key: ctk_<id>_<secret>"
  parameters:
    AccountIdQuery:
      name: accountId
      in: query
      required: false
      description: The account (default the caller's current account)
      schema: { type: string, maxLength: 64 }
  responses:
    AgentStatus:
      description: The agent's state after the action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentStatusResult" }
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Health:
      description: Health
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Health" }
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        field: { type: string, description: The invalid field, for 400s }
        missing: { $ref: "#/components/schemas/Missing" }
        canFix: { type: boolean, description: "with missing: the caller may fix it (the web UI then shows a button to the fix)" }
    Missing:
      type: string
      description: >-
        Setup an action needs and does not have yet (R22). trading_budget: Risk limits; account_keys: the account's
        keys (Platform accounts); account: no eToro account (Platform accounts); watchlist: the watchlist is empty;
        reconcile: run a reconciliation; kill_reset: an admin resets the kill switch; llm_profile: the LLM reviewer
        has no usable default profile or key; email_server: no mail server (E-mail); public_url: the deployment
        setting CACTUSTRADE_PUBLIC_URL is not set.
      enum: [trading_budget, account_keys, account, watchlist, reconcile, kill_reset, llm_profile, email_server, public_url]
    MissingItem:
      type: object
      required: [what, canFix]
      properties:
        what: { $ref: "#/components/schemas/Missing" }
        canFix: { type: boolean, description: "the caller may fix it" }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        detail: { type: string }
    Role:
      type: string
      enum: [admin, operator, viewer]
    TradingMode:
      type: string
      enum: [demo, real]
    AgentState:
      type: string
      enum: [stopped, running, paused, killed]
    PublicStatus:
      type: object
      required: [version, passwordResetAvailable]
      properties:
        version: { type: string }
        passwordResetAvailable: { type: boolean, description: "\"Forgot password\" works (mail server and public address set)" }
    PasswordResetRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, maxLength: 64 }
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string, maxLength: 256 }
        password: { type: string, maxLength: 512 }
    NotifyPrefs:
      type: object
      required: [trades, watchlist, alerts]
      properties:
        trades: { type: boolean, description: "orders, fills and closes (buy, sell, short)" }
        watchlist: { type: boolean, description: "shares added to or removed from a watchlist" }
        alerts: { type: boolean, description: "warnings and errors: kill switch, limits, failures" }
    Profile:
      type: object
      required: [email, notify]
      properties:
        email: { type: string, maxLength: 254, description: "empty = no e-mail" }
        notify: { $ref: "#/components/schemas/NotifyPrefs" }
    SmtpPreset:
      type: object
      required: [id, label, host, port, tls]
      properties:
        id: { type: string }
        label: { type: string }
        host: { type: string }
        port: { type: integer }
        tls: { type: string }
    EmailSetupInput:
      type: object
      required: [enabled, host, port, username, from, tls]
      properties:
        enabled: { type: boolean, description: "use this server for all e-mail" }
        host: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 0, maximum: 65535 }
        username: { type: string, maxLength: 254 }
        from: { type: string, maxLength: 320, description: "Send as: Name <address>; empty = the user name" }
        tls: { type: string, enum: [starttls, tls, none] }
        password: { type: string, maxLength: 1024, description: "write-only; absent = keep, empty = remove" }
    EmailSetup:
      type: object
      required: [enabled, host, port, username, from, tls, passwordSet, warnings, fallback, presets]
      properties:
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        from: { type: string }
        tls: { type: string }
        passwordSet: { type: boolean }
        warnings: { type: array, items: { type: string } }
        fallback: { type: string, description: "the deployment's server, used while this one is off (empty = none)" }
        presets: { type: array, items: { $ref: "#/components/schemas/SmtpPreset" } }
    TestEmailRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, maxLength: 254 }
    OutboxMail:
      type: object
      required: [id, to, subject, createdAt, attempts, lastError]
      properties:
        id: { type: string }
        to: { type: string }
        subject: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
        attempts: { type: integer }
        lastError: { type: string }
    SystemStatus:
      type: object
      required: [version, build, mode, agentState, database, startedAt, now]
      properties:
        version: { type: string }
        build: { type: string }
        mode: { $ref: "#/components/schemas/TradingMode" }
        agentState: { $ref: "#/components/schemas/AgentState" }
        database: { type: string, enum: [sqlite, mariadb] }
        startedAt: { type: string, format: date-time }
        now: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/Account" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 256 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 256 }
        newPassword: { type: string, maxLength: 256 }
    User:
      type: object
      required: [id, username, role, disabled, mustChangePassword, createdAt, updatedAt]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        mustChangePassword:
          type: boolean
          description: |
            The account still has the default password (the built-in admin/admin). Until it
            is changed, every endpoint except /auth/me, /auth/password and /auth/logout
            answers 403 with the title "Password change required".
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Me:
      type: object
      required: [user, permissions, via]
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions:
          type: array
          items: { type: string }
        via: { type: string, enum: [session, apikey] }
        csrfToken:
          type: string
          description: Send as X-CSRF-Token on state-changing requests (session only)
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 256 }
        role: { $ref: "#/components/schemas/Role" }
    UpdateUserRequest:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        password: { type: string, maxLength: 256 }
    ApiKey:
      type: object
      required: [id, ownerId, name, role, createdAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    CreateApiKeyRequest:
      type: object
      required: [name, role]
      properties:
        name: { type: string, maxLength: 64 }
        role: { $ref: "#/components/schemas/Role" }
        expiresInDays: { type: integer, minimum: 0, maximum: 365, description: 0 = never }
    CreatedApiKey:
      type: object
      required: [apiKey, secret]
      properties:
        apiKey: { $ref: "#/components/schemas/ApiKey" }
        secret: { type: string, description: "Bearer value; shown once, never again" }
    CredentialName:
      type: string
      enum: [etoro_demo_api_key, etoro_demo_user_key, etoro_real_api_key, etoro_real_user_key]
    Credential:
      type: object
      required: [name, label, set]
      properties:
        name: { $ref: "#/components/schemas/CredentialName" }
        label: { type: string }
        set: { type: boolean }
        source: { type: string, enum: [ui, env], description: "env = from an environment variable; read-only here" }
        envVar: { type: string, description: The environment variable that may provide it }
        updatedAt: { type: string, format: date-time }
    SetCredentialRequest:
      type: object
      required: [value]
      properties:
        value: { type: string, maxLength: 4096, description: "Write-only: never returned" }
    Cents:
      type: integer
      format: int64
      description: US dollars in cents (the eToro account currency is USD)
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'
      description: An exact decimal (prices and units, up to 6 places)
    Market:
      type: string
      enum: ["", LSE, NYSE, ASX]
      description: LSE, NYSE (NYSE and NASDAQ share a calendar), ASX or "" when not tradable here
    BrokerCheck:
      type: object
      required: [mode, ok, latencyMs, checkedAt, configuredKeys]
      properties:
        mode: { $ref: "#/components/schemas/TradingMode" }
        ok: { type: boolean }
        error: { type: string }
        configuredKeys: { type: boolean, description: false when the mode's key pair is not set }
        latencyMs: { type: integer, format: int64 }
        availableCashCents: { $ref: "#/components/schemas/Cents" }
        equityCents: { $ref: "#/components/schemas/Cents" }
        positions: { type: integer }
        nonConforming: { type: integer, description: positions that are not real shares, long, leverage 1 }
        checkedAt: { type: string, format: date-time }
    Position:
      type: object
      required: [positionId, instrumentId, openedAt, openRate, units, amountCents, unrealisedPnlCents, realAsset, long, leverage]
      properties:
        positionId: { type: integer, format: int64 }
        instrumentId: { type: integer, format: int64 }
        openedAt: { type: string, format: date-time }
        openRate: { $ref: "#/components/schemas/Decimal" }
        units: { $ref: "#/components/schemas/Decimal" }
        amountCents: { $ref: "#/components/schemas/Cents" }
        unrealisedPnlCents: { $ref: "#/components/schemas/Cents" }
        stopLossRate: { $ref: "#/components/schemas/Decimal" }
        takeProfitRate: { $ref: "#/components/schemas/Decimal" }
        realAsset: { type: boolean }
        long: { type: boolean }
        leverage: { type: integer }
    Portfolio:
      type: object
      required: [mode, availableCashCents, pendingOpenCents, equityCents, positions, asOf]
      properties:
        mode: { $ref: "#/components/schemas/TradingMode" }
        availableCashCents: { $ref: "#/components/schemas/Cents" }
        pendingOpenCents: { $ref: "#/components/schemas/Cents" }
        equityCents: { $ref: "#/components/schemas/Cents" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        asOf: { type: string, format: date-time }
    MarketSession:
      type: object
      required: [market, trading, open]
      properties:
        market: { $ref: "#/components/schemas/Market" }
        trading: { type: boolean, description: the market trades today (its local date) }
        open: { type: boolean, description: in its trading session right now }
        opens: { type: string, format: date-time }
        closes: { type: string, format: date-time }
        note: { type: string }
    Instrument:
      type: object
      required: [instrumentId, symbol, name, type, market]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        name: { type: string }
        type: { type: string }
        exchangeId: { type: integer, format: int64 }
        market: { $ref: "#/components/schemas/Market" }
    Eligibility:
      type: object
      required: [realLong]
      properties:
        realLong: { type: boolean, description: can be bought as a real share, long, leverage 1 }
        reason: { type: string }
        minPositionCents: { $ref: "#/components/schemas/Cents" }
        checkedAt: { type: string, format: date-time }
    WatchItem:
      type: object
      required: [instrument, eligibility, addedBy, addedAt]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        eligibility: { $ref: "#/components/schemas/Eligibility" }
        addedBy: { type: string }
        addedAt: { type: string, format: date-time }
    AddWatchRequest:
      type: object
      required: [instrumentId]
      properties:
        instrumentId: { type: integer, format: int64, minimum: 1 }
    Quote:
      type: object
      required: [instrumentId, bid, ask, at, delayed]
      properties:
        instrumentId: { type: integer, format: int64 }
        bid: { $ref: "#/components/schemas/Decimal" }
        ask: { $ref: "#/components/schemas/Decimal" }
        at: { type: string, format: date-time }
        delayed: { type: boolean }
    Event:
      type: object
      required: [id, at, kind, severity, title, actor]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string }
        severity: { type: string, enum: [info, success, warning, danger] }
        title: { type: string }
        detail: { type: string }
        actor: { type: string }
    EventFeed:
      type: object
      required: [events, unread]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        unread: { type: integer }
    RiskLimits:
      type: object
      required: [tradingBudgetCents, dailyLossBp, drawdownBp, maxPositionBp, maxOpenPositions, noEntryBeforeCloseMinutes, flattenBeforeCloseMinutes, maxPortfolioAgeSeconds, maxQuoteAgeSeconds, maxShortBp]
      properties:
        tradingBudgetCents: { $ref: "#/components/schemas/Cents" }
        dailyLossBp: { type: integer, description: "stop new entries at this loss from the start-of-day equity (bp; 200 = 2 %)" }
        drawdownBp: { type: integer, description: "kill switch at this fall from the high-water mark (bp)" }
        maxPositionBp: { type: integer, description: "largest position as a share of equity (bp; 0 = off)" }
        maxOpenPositions: { type: integer }
        noEntryBeforeCloseMinutes: { type: integer }
        flattenBeforeCloseMinutes: { type: integer }
        maxPortfolioAgeSeconds: { type: integer }
        maxQuoteAgeSeconds: { type: integer }
        maxShortBp: { type: integer, description: "all short exposure as a share of the trading budget (bp; 0 = no shorts; at most 2500 = 25 %)" }
    RiskLimitsView:
      description: The limits as GET returns them, with whether the caller may change them now (not part of the PUT body)
      allOf:
        - $ref: "#/components/schemas/RiskLimits"
        - type: object
          required: [canEdit]
          properties:
            canEdit: { type: boolean, description: "the caller may change the limits now (same rules as the PUT)" }
            editBlockedReason: { type: string, description: "why not, for people (absent when canEdit)" }
    LlmProvider:
      type: object
      required: [id, label, defaultBaseUrl, keyRequired, note]
      properties:
        id: { type: string }
        label: { type: string }
        defaultBaseUrl: { type: string }
        keyRequired: { type: boolean }
        note: { type: string }
    LlmProfile:
      type: object
      required: [id, name, provider, model, baseUrl, timeoutSeconds, keySet, inputPricePerMTok, outputPricePerMTok]
      properties:
        inputPricePerMTok: { $ref: "#/components/schemas/LlmPrice" }
        outputPricePerMTok: { $ref: "#/components/schemas/LlmPrice" }
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        model: { type: string, description: "empty = the provider's default (Anthropic: claude-opus-5-5)" }
        baseUrl: { type: string, description: "empty = the provider's address" }
        timeoutSeconds: { type: integer }
        keySet: { type: boolean }
    LlmPrice:
      type: string
      pattern: '^([0-9]{1,7}(\.[0-9]{1,6})?)?$'
      description: "What the provider charges in USD per million tokens, as entered by the admin (OD13: no built-in price table). \"\" or \"0\" = unknown, and then every call's cost is unknown. At most 1000000."
    LlmProfileInput:
      type: object
      required: [name, provider, model, baseUrl, timeoutSeconds, inputPricePerMTok, outputPricePerMTok]
      properties:
        inputPricePerMTok: { $ref: "#/components/schemas/LlmPrice" }
        outputPricePerMTok: { $ref: "#/components/schemas/LlmPrice" }
        name: { type: string, maxLength: 80, description: "empty = provider and model" }
        provider: { type: string, maxLength: 32 }
        model: { type: string, maxLength: 200 }
        baseUrl: { type: string, maxLength: 500 }
        timeoutSeconds: { type: integer, minimum: 0, maximum: 600 }
        apiKey: { type: string, maxLength: 4096, description: "write-only; absent = keep the stored key, empty = remove it" }
    LlmSettings:
      type: object
      required: [enabled, activeProfileId]
      properties:
        enabled: { type: boolean, description: "review every proposed trade (any reviewer failure rejects the trade)" }
        activeProfileId: { type: string, maxLength: 64, description: "the profile reviews use (empty = none)" }
    LlmModelsRequest:
      type: object
      required: [provider, baseUrl]
      properties:
        provider: { type: string, maxLength: 32 }
        baseUrl: { type: string, maxLength: 500 }
        apiKey: { type: string, maxLength: 4096, description: "the key typed on the page; absent = the stored key of profileId" }
        profileId: { type: string, maxLength: 64 }
    LlmSetup:
      type: object
      required: [settings, profiles, providers, defaultAnthropicModel]
      properties:
        settings: { $ref: "#/components/schemas/LlmSettings" }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/LlmProfile" }
        defaultAnthropicModel: { type: string }
        providers:
          type: array
          items: { $ref: "#/components/schemas/LlmProvider" }
    LlmTestResult:
      type: object
      required: [ok, latencyMs]
      properties:
        ok: { type: boolean }
        verdict: { type: string, enum: [approve, reduce, reject] }
        sizeMultiplier: { type: number }
        reason: { type: string }
        error: { type: string }
        latencyMs: { type: integer, format: int64 }
        model: { type: string, description: "the model that answered (the one asked for when there was no answer)" }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        costUsd: { $ref: "#/components/schemas/UsdCost" }
        callId: { type: string, description: "the logged call (purpose test); absent when it could not be logged" }
    Platform:
      type: string
      enum: [etoro, trading212, saxo, tiger]
      description: eToro (traded), or Trading 212, Saxo or Tiger Brokers (view-only)
    CredentialSpec:
      type: object
      required: [key, label, help, multiline, optional, setByFlow]
      description: One credential of a platform account (never its value)
      properties:
        key: { type: string, description: "the name used in SetAccountKeysRequest.values" }
        label: { type: string }
        help: { type: string }
        multiline: { type: boolean, description: a PEM key; line breaks are kept }
        optional: { type: boolean }
        setByFlow: { type: boolean, description: "set by the platform's sign-in (Saxo's Connect), not typed in" }
    PlatformInfo:
      type: object
      required: [platform, label, viewOnly, connectable, credentials]
      properties:
        platform: { $ref: "#/components/schemas/Platform" }
        label: { type: string }
        viewOnly: { type: boolean, description: cactusTrade shows the platform's accounts but never trades them }
        connectable: { type: boolean, description: the platform signs in through the browser (Saxo) }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/CredentialSpec" }
    AccountCredential:
      allOf:
        - $ref: "#/components/schemas/CredentialSpec"
        - type: object
          required: [set]
          properties:
            set: { type: boolean }
            updatedAt: { type: string, format: date-time, description: when it was last stored (absent when unknown) }
    ConnectStart:
      type: object
      required: [authorizeUrl, redirectUri]
      properties:
        authorizeUrl: { type: string, description: "Saxo's sign-in page; open it in this browser" }
        redirectUri: { type: string, description: the address registered for the app in the Saxo developer portal }
    Account:
      type: object
      required: [id, name, ownerId, ownerName, mode, platform, envKeys, access, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        mode: { $ref: "#/components/schemas/TradingMode" }
        platform: { $ref: "#/components/schemas/Platform" }
        envKeys: { type: boolean, description: "uses the deployment's ETORO_DEMO_PUB / _PK" }
        access: { type: string, enum: [view, trade, owner] }
        createdAt: { type: string, format: date-time }
    CreateAccountRequest:
      type: object
      required: [name, mode]
      properties:
        name: { type: string, maxLength: 60 }
        mode: { $ref: "#/components/schemas/TradingMode" }
        platform: { $ref: "#/components/schemas/Platform" }
    RenameAccountRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
    AccountRef:
      type: object
      required: [accountId]
      properties:
        accountId: { type: string, maxLength: 64 }
    AccountKeys:
      type: object
      required: [apiKeySet, userKeySet, fromEnvironment, complete, credentials, connectable]
      properties:
        apiKeySet: { type: boolean, description: the platform's first credential is set }
        userKeySet: { type: boolean, description: the platform's second credential is set }
        fromEnvironment: { type: boolean }
        complete: { type: boolean, description: enough is set to read the account }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/AccountCredential" }
        connectable: { type: boolean, description: the platform signs in through the browser (Saxo) }
        connectRedirectUri: { type: string, description: "the redirect address to register with the platform (absent without CACTUSTRADE_PUBLIC_URL)" }
    SetAccountKeysRequest:
      type: object
      properties:
        apiKey: { type: string, maxLength: 4096, description: "the platform's first credential (eToro Public API Key…); empty = keep" }
        userKey: { type: string, maxLength: 4096, description: "the platform's second credential (eToro User Key…); empty = keep" }
        values:
          type: object
          maxProperties: 8
          additionalProperties: { type: string, maxLength: 4096 }
          description: "credentials by key (CredentialSpec.key); empty = keep"
    MinorUnits:
      type: integer
      format: int64
      description: |
        An amount in minor units of the currency given next to it: hundredths for most (USD
        cents, GBP pence…), whole units for JPY and KRW.
    Holding:
      type: object
      required: [symbol, name, currency, quantity, avgPrice, currentPrice, value, cost, pnl, long, cfd, unknown]
      properties:
        unknown: { type: boolean, description: "the platform did not report value and P&L in the account currency: value, cost and pnl are 0 and mean unknown" }
        symbol: { type: string }
        name: { type: string }
        currency: { type: string, description: "the instrument's price currency (\"\" when unknown)" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        avgPrice: { $ref: "#/components/schemas/Decimal" }
        currentPrice: { $ref: "#/components/schemas/Decimal" }
        value: { $ref: "#/components/schemas/MinorUnits" }
        cost: { $ref: "#/components/schemas/MinorUnits" }
        pnl: { $ref: "#/components/schemas/MinorUnits" }
        openedAt: { type: string, format: date-time }
        long: { type: boolean }
        cfd: { type: boolean }
    Holdings:
      type: object
      required: [platform, currency, cash, invested, equity, unrealisedPnl, realisedPnl, positions, asOf]
      description: Amounts are minor units of `currency`, the account's own currency.
      properties:
        platform: { $ref: "#/components/schemas/Platform" }
        currency: { type: string }
        cash: { $ref: "#/components/schemas/MinorUnits" }
        invested: { $ref: "#/components/schemas/MinorUnits" }
        equity: { $ref: "#/components/schemas/MinorUnits" }
        unrealisedPnl: { $ref: "#/components/schemas/MinorUnits" }
        realisedPnl: { $ref: "#/components/schemas/MinorUnits" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Holding" }
        asOf: { type: string, format: date-time }
    AccountHoldings:
      type: object
      required: [account, noKeys]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        holdings: { $ref: "#/components/schemas/Holdings" }
        error: { type: string, description: why the account could not be read }
        noKeys: { type: boolean, description: the account's keys are not set yet }
        reconnect: { type: boolean, description: "the platform's sign-in has lapsed (Saxo): the owner connects again" }
    CurrencyTotal:
      type: object
      required: [currency, accounts, cash, equity, unrealisedPnl]
      properties:
        currency: { type: string }
        accounts: { type: integer }
        cash: { $ref: "#/components/schemas/MinorUnits" }
        equity: { $ref: "#/components/schemas/MinorUnits" }
        unrealisedPnl: { $ref: "#/components/schemas/MinorUnits" }
    Overview:
      type: object
      required: [accounts, totals, asOf]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountHoldings" }
        totals:
          type: array
          items: { $ref: "#/components/schemas/CurrencyTotal" }
        asOf: { type: string, format: date-time }
    EquityPoint:
      type: object
      required: [at, cash, equity]
      properties:
        at: { type: string, format: date-time }
        cash: { $ref: "#/components/schemas/MinorUnits" }
        equity: { $ref: "#/components/schemas/MinorUnits" }
    EquitySeries:
      type: object
      required: [accountId, name, platform, mode, currency, points]
      properties:
        accountId: { type: string }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        mode: { $ref: "#/components/schemas/TradingMode" }
        currency: { type: string }
        points:
          type: array
          items: { $ref: "#/components/schemas/EquityPoint" }
    AccountShare:
      type: object
      required: [userId, username, access, createdAt]
      properties:
        userId: { type: string }
        username: { type: string }
        access: { type: string, enum: [view, trade] }
        createdAt: { type: string, format: date-time }
    ShareAccountRequest:
      type: object
      required: [username, access]
      properties:
        username: { type: string, maxLength: 64 }
        access: { type: string, enum: [view, trade] }
    ThemeInput:
      type: object
      required: [name, keywords, industryId, enabled, instruments]
      properties:
        name: { type: string, maxLength: 60 }
        keywords: { type: array, maxItems: 10, items: { type: string, maxLength: 100 } }
        industryId: { type: integer, format: int64, minimum: 0, description: "0 = none" }
        enabled: { type: boolean }
        instruments: { type: array, maxItems: 50, items: { type: integer, format: int64 } }
        llmProfileId: { type: string, maxLength: 64, description: "the LLM reviewer profile for this theme's candidates (empty = the default profile)" }
    ThemeShare:
      type: object
      required: [instrumentId, symbol, name, market]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        name: { type: string }
        market: { type: string }
    Theme:
      allOf:
        - $ref: "#/components/schemas/ThemeInput"
        - type: object
          required: [id, shares, createdAt, updatedAt]
          properties:
            id: { type: string }
            shares:
              type: array
              description: the picked shares with their symbols
              items: { $ref: "#/components/schemas/ThemeShare" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Industry:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    ReviewCheck:
      type: object
      required: [rule, pass]
      properties:
        rule: { type: string }
        pass: { type: boolean }
        detail: { type: string }
    Review:
      type: object
      required: [instrumentId, symbol, theme, at, outcome, checks, summary]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        theme: { type: string }
        at: { type: string, format: date-time }
        outcome: { type: string, enum: [no_signal, candidate, added, skipped, error] }
        direction: { type: string, enum: [long, short] }
        probs:
          type: object
          additionalProperties: { type: number }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ReviewCheck" }
        summary: { type: string }
    ReviewBoard:
      type: object
      required: [scannerEnabled, reviews]
      properties:
        scannerEnabled: { type: boolean }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/Review" }
    ScannerSwitch:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    ScanResult:
      type: object
      required: [reviewed, added]
      properties:
        reviewed: { type: integer }
        added: { type: array, items: { type: string } }
    AuditEntry:
      type: object
      required: [id, at, actor, action, target, details, remoteIp]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actorId: { type: string }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        details: { type: string }
        remoteIp: { type: string }
    AgentStatusResult:
      type: object
      required: [accountId, state]
      properties:
        accountId: { type: string }
        state: { $ref: "#/components/schemas/AgentState" }
    KillRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: "why (kept in the audit log and the event)" }
    KillReport:
      type: object
      required: [accountId, already, cancelled, closing, errors]
      properties:
        accountId: { type: string }
        already: { type: boolean, description: "the kill switch was already on (flattened again)" }
        cancelled: { type: integer, description: "cancels sent for cactusTrade's pending open orders" }
        closing: { type: integer, description: "closes sent or in flight for positions cactusTrade opened" }
        errors: { type: array, items: { type: string } }
    ResetKillRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, maxLength: 200, description: "exactly RESET <account name>" }
    Reconciliation:
      type: object
      required: [accountId, ok, reason]
      properties:
        accountId: { type: string }
        ok: { type: boolean, description: "eToro and our records agree; entries need it" }
        at: { type: string, format: date-time, description: "absent = not reconciled since the start" }
        reason: { type: string, description: "why not OK (empty when OK)" }
    AgentControls:
      type: object
      required: [start, pause, stop, kill, reset, gated]
      description: The agent actions the caller may take on this account
      properties:
        start: { type: boolean }
        pause: { type: boolean }
        stop: { type: boolean }
        kill: { type: boolean }
        reset: { type: boolean }
        gated: { type: boolean, description: "a real-money account: real trading needs the phase-7 gate" }
        startBlockedReason:
          type: string
          description: |
            Why `start` is false although the caller could otherwise start the agent: this
            process's agent loop is not running (still starting up, or the start-up resume
            failed and cactusTrade must be restarted). Absent when nothing blocks it.
    BlockedInstrument:
      type: object
      required: [instrumentId, symbol, reason, at]
      properties:
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        reason: { type: string }
        at: { type: string, format: date-time }
    FlattenTime:
      type: object
      required: [market, trading]
      properties:
        market: { $ref: "#/components/schemas/Market" }
        trading: { type: boolean, description: "the market trades today" }
        closes: { type: string, format: date-time }
        flattenAt: { type: string, format: date-time, description: "every position of this market is closed from then on" }
        note: { type: string }
    AgentLease:
      type: object
      required: [mine, other]
      description: Who may send orders for the account (one process at a time)
      properties:
        mine: { type: boolean, description: "this server holds it" }
        other: { type: boolean, description: "another process holds it: this server sends nothing" }
        expiresAt: { type: string, format: date-time }
    AgentPanel:
      type: object
      required: [account, state, reconciliation, limits, killed, dayStopped, riskDay, today, startOfDayEquityCents, highWaterMarkCents,
                 equityKnown, blocked, flatten, lease, controls, resetPhrase, openPositions, pendingOrders, missing]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        state: { $ref: "#/components/schemas/AgentState" }
        reconciliation: { $ref: "#/components/schemas/Reconciliation" }
        limits: { $ref: "#/components/schemas/RiskLimits" }
        killed: { type: boolean }
        killReason: { type: string }
        killedAt: { type: string, format: date-time }
        dayStopped: { type: boolean, description: "the daily floor was reached: no entries until the next risk day (22:00 UTC)" }
        riskDay: { type: string, description: "the risk day of the stored figures (empty = none yet)" }
        today: { type: string, description: "the current risk day" }
        startOfDayEquityCents: { $ref: "#/components/schemas/Cents" }
        highWaterMarkCents: { $ref: "#/components/schemas/Cents" }
        equityKnown: { type: boolean }
        equityCents: { $ref: "#/components/schemas/Cents" }
        equityError: { type: string }
        dailyFloorCents: { $ref: "#/components/schemas/Cents" }
        toDailyFloorCents: { $ref: "#/components/schemas/Cents" }
        drawdownFloorCents: { $ref: "#/components/schemas/Cents" }
        toDrawdownFloorCents: { $ref: "#/components/schemas/Cents" }
        blocked: { type: array, items: { $ref: "#/components/schemas/BlockedInstrument" } }
        flatten: { type: array, items: { $ref: "#/components/schemas/FlattenTime" } }
        lease: { $ref: "#/components/schemas/AgentLease" }
        controls: { $ref: "#/components/schemas/AgentControls" }
        resetPhrase: { type: string, description: "what an admin types to reset the kill switch" }
        openPositions: { type: integer, description: "positions cactusTrade opened that are open" }
        pendingOrders: { type: integer, description: "orders of ours that are not final" }
        missing:
          type: array
          description: "what must be set up before the agent can start (empty while it runs and on a real-money account)"
          items: { $ref: "#/components/schemas/MissingItem" }
    Order:
      type: object
      required: [requestId, mode, kind, direction, instrumentId, symbol, amountCents, state, reason, sends, createdAt, updatedAt]
      properties:
        requestId: { type: string, description: "our x-request-id, stored before the order is sent" }
        mode: { $ref: "#/components/schemas/TradingMode" }
        kind: { type: string, description: "open, close or cancel" }
        direction: { type: string, description: "long, short or empty (cancel)" }
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        amountCents: { $ref: "#/components/schemas/Cents" }
        entry: { $ref: "#/components/schemas/Decimal" }
        stopLoss: { $ref: "#/components/schemas/Decimal" }
        takeProfit: { $ref: "#/components/schemas/Decimal" }
        positionId: { type: integer, format: int64 }
        etoroOrderId: { type: integer, format: int64 }
        state: { type: string, description: "created, sent, pending, filled, partially_filled, rejected, cancelled, unknown or abandoned" }
        reason: { type: string }
        sends: { type: integer }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UsdCost:
      type: string
      pattern: '^[0-9]+(\.[0-9]{1,6})?$'
      description: US dollars to the micro-dollar (absent = unknown, OD13)
    Decision:
      type: object
      description: One candidate the agent handled (PLAN 5.5)
      required: [id, accountId, at, instrumentId, symbol, direction, playbook, signalReason, entry, stopLoss, suggestedSizeCents, regimeProbs, verdict, sizeBp, verdictReason, llmCallId, riskAllowed, riskSizeCents, riskReason, outcome, orderRequestId, orderState]
      properties:
        id: { type: string }
        accountId: { type: string }
        at: { type: string, format: date-time }
        instrumentId: { type: integer, format: int64 }
        symbol: { type: string }
        direction: { type: string, description: "long or short" }
        playbook: { type: string }
        signalReason: { type: string }
        entry: { $ref: "#/components/schemas/Decimal" }
        stopLoss: { $ref: "#/components/schemas/Decimal" }
        takeProfit: { $ref: "#/components/schemas/Decimal" }
        suggestedSizeCents: { $ref: "#/components/schemas/Cents" }
        regimeProbs:
          type: object
          description: the regime model's probabilities (regime → 0..1)
          additionalProperties: { type: number, format: double }
        verdict: { type: string, description: "approve, reduce, reject or empty (not reviewed: reviewing off, or ended before the review)" }
        sizeBp: { type: integer, description: "the size the reviewer left, in basis points of the proposed size" }
        verdictReason: { type: string }
        llmCallId: { type: string, description: "the logged reviewer call (empty = none)" }
        riskAllowed: { type: boolean }
        riskSizeCents: { $ref: "#/components/schemas/Cents" }
        riskReason: { type: string, description: "the risk engine's answer, or why the candidate ended before or after it" }
        outcome: { type: string, description: "pending, rejected_reviewer, rejected_cost, rejected_risk, ordered or order_failed" }
        orderRequestId: { type: string, description: "the order's x-request-id (empty = no order)" }
        orderState: { type: string, description: "the order's state now (empty = no order)" }
    LlmCall:
      type: object
      description: One call to an LLM reviewer as sent and received (never a key or a header)
      required: [id, purpose, profileId, provider, model, prompt, response, inputTokens, outputTokens, latencyMs, error, at]
      properties:
        id: { type: string }
        purpose: { type: string, description: "agent, scanner or test" }
        profileId: { type: string }
        provider: { type: string }
        model: { type: string, description: "the model that answered" }
        prompt: { type: string, description: "the request body as sent (cut at 32 KiB)" }
        response: { type: string, description: "the raw response body (cut at 32 KiB)" }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        latencyMs: { type: integer, format: int64 }
        costUsd: { $ref: "#/components/schemas/UsdCost" }
        error: { type: string }
        at: { type: string, format: date-time }
    DecisionDetail:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/Decision" }
        call: { $ref: "#/components/schemas/LlmCall" }
    LlmUsageRow:
      type: object
      required: [profileId, profileName, purpose, calls, failed, inputTokens, outputTokens, knownCostUsd, costUnknownCalls]
      properties:
        profileId: { type: string }
        profileName: { type: string, description: "empty when the profile was deleted" }
        purpose: { type: string, description: "agent, scanner or test (empty in the total)" }
        calls: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        knownCostUsd: { $ref: "#/components/schemas/UsdCost" }
        costUnknownCalls: { type: integer, format: int64, description: "calls without a price (their cost is unknown; knownCostUsd leaves them out)" }
        costUsd: { $ref: "#/components/schemas/UsdCost" }
    LlmUsage:
      type: object
      required: [days, since, rows, total]
      properties:
        days: { type: integer }
        since: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: "#/components/schemas/LlmUsageRow" }
        total: { $ref: "#/components/schemas/LlmUsageRow" }
