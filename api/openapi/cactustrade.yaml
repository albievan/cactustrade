        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/agent:
    get:
      tags: [agent]
      operationId: getAgent
      summary: The agent of an account — state, reconciliation, kill switch, distance to the limits (viewer)
      description: |
        Reads the account's portfolio once (read-only) for the equity; when that fails the
        figures that need it are left out and `equityError` says why. `controls` lists the
        actions the caller may take (the server decides; the UI only shows them). On a real
        account (`controls.gated`) nothing can be started until the phase-7 gate.
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPanel" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/agent/start:
    post:
      tags: [agent]
      operationId: startAgent
      summary: Start the agent (operator with trade access, web session only — never an API key)
      description: |
        Refused (403) for a real-money account (phase 7) and for an API key; 409 while the
        kill switch is on or the account is not reconciled; 422 without a trading budget or
        with invalid limits; 503 without the account's eToro keys.
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      responses:
        "200": { $ref: "#/components/responses/AgentStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/agent/pause:
    post:
      tags: [agent]
      operationId: pauseAgent
      summary: Pause a running agent — no new entries, exits continue, limits stay locked (operator; session or API key)
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      responses:
        "200": { $ref: "#/components/responses/AgentStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
