      tags: [agent]
      operationId: stopAgent
      summary: Stop the agent — no new entries, exits continue, limits may change (operator; session or API key)
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      responses:
        "200": { $ref: "#/components/responses/AgentStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/agent/kill:
    post:
      tags: [agent]
      operationId: killAgent
      summary: Pull the kill switch (operator with trade access; session or API key)
      description: |
        Stores the kill first, then cancels cactusTrade's pending orders and closes every
        position cactusTrade opened (never positions opened outside cactusTrade). Only an
        admin can reset it. Killing again flattens again.
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KillRequest" }
      responses:
        "200":
          description: Killed; what was sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillReport" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/agent/reset:
    post:
      tags: [agent]
      operationId: resetKill
      summary: Reset the kill switch (admin, web session only, typed phrase "RESET <account name>")
      description: |
        The high-water mark becomes the equity read from eToro now; the agent comes back
        stopped. 422 when the phrase is wrong, 409 when the kill switch is not on.
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetKillRequest" }
      responses:
        "200": { $ref: "#/components/responses/AgentStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/agent/reconcile:
    post:
      tags: [agent]
      operationId: reconcileAgent
      summary: Reconcile the account with eToro now (operator with trade access; read-only on eToro)
      description: A pass that finds a problem answers 200 with `ok` false and the reason.
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      responses:
        "200":
