# cactusTrade on Docker (Docker Desktop, Docker Engine or Podman) with MariaDB. Settings and
# volume mappings come from .env; secrets from files in ${SECRETS_DIR}. Use ./deploy.sh.
name: cactustrade
services:
  mariadb:
    image: mariadb:11@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    restart: unless-stopped
    # Hardened (PLAN 7.1.16): the image's own mysql user from the start (volume-init hands it
    # the data folder), no capabilities, no privilege gain, read-only root file system; only
    # the data folder, the socket folder and /tmp are writable.
    user: "999:999"
    read_only: true
    tmpfs: ["/run/mysqld:mode=0700,uid=999,gid=999", "/tmp:mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      volume-init: { condition: service_completed_successfully }
    environment:
      TZ: ${TZ}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - ${MARIADB_DATA_DIR}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  # The app runs as uid 65532 and MariaDB as 999 (mysql); make each mapped data folder
  # writable for its own service, and only for it.
  volume-init:
    image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command: ["sh", "-c", "chown -R 65532:65532 /data && chmod 700 /data && chown -R 999:999 /mariadb && chmod 700 /mariadb"]
    volumes:
      - ${DATA_DIR}:/data
      - ${MARIADB_DATA_DIR}:/mariadb
    network_mode: none
    restart: "no"

  app:
    image: ${CACTUSTRADE_IMAGE}
    build:
      context: .
      args:
        VERSION: ${CACTUSTRADE_VERSION:-dev}
        BUILD: ${CACTUSTRADE_BUILD:-0}
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # GOMEMLIMIT (below) stays under this: at most 3 password hashes of 64 MiB at once.
    mem_limit: 512m
    depends_on:
      mariadb: { condition: service_healthy }
      volume-init: { condition: service_completed_successfully }
    environment:
      TZ: ${TZ}
      GOMEMLIMIT: 400MiB
      CACTUSTRADE_DB_DRIVER: mariadb
      CACTUSTRADE_DB_HOST: mariadb
      CACTUSTRADE_DB_NAME: ${MARIADB_DATABASE}
      CACTUSTRADE_DB_USER: ${MARIADB_USER}
      CACTUSTRADE_SECRETS_DIR: /run/secrets
      CACTUSTRADE_TLS: auto
      CACTUSTRADE_ADDR: ":8443"
      CACTUSTRADE_LOG_LEVEL: ${CACTUSTRADE_LOG_LEVEL}
      CACTUSTRADE_COOKIE_SECURE: ${CACTUSTRADE_COOKIE_SECURE}
      # eToro demo keys (empty files when not provided; then set them in the web UI).
      ETORO_DEMO_PUB_FILE: /run/secrets/etoro_demo_pub
      ETORO_DEMO_PK_FILE: /run/secrets/etoro_demo_pk
      # E-mail: links point here; the fallback mail server (see .env).
      CACTUSTRADE_PUBLIC_URL: ${CACTUSTRADE_PUBLIC_URL:-}
      CACTUSTRADE_SMTP_HOST: ${CACTUSTRADE_SMTP_HOST:-}
      CACTUSTRADE_SMTP_PORT: ${CACTUSTRADE_SMTP_PORT:-587}
      CACTUSTRADE_SMTP_TLS: ${CACTUSTRADE_SMTP_TLS:-starttls}
      CACTUSTRADE_SMTP_USER: ${CACTUSTRADE_SMTP_USER:-}
      CACTUSTRADE_SMTP_FROM: ${CACTUSTRADE_SMTP_FROM:-}
      CACTUSTRADE_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      # Password reset by e-mail through the Mailpit test mailbox only on an explicit opt-in
      # (PLAN 7.1.15): its mail never reaches the user.
      CACTUSTRADE_SMTP_TEST_MAILBOX_RESETS: ${CACTUSTRADE_SMTP_TEST_MAILBOX_RESETS:-false}
    secrets: [db_password, master_key, metrics_token, etoro_demo_pub, etoro_demo_pk, smtp_password]
    volumes:
      - ${DATA_DIR}:/data
    ports:
      - "${HTTPS_PORT}:8443"

  # Test mailbox (COMPOSE_PROFILES=mailpit): catches every e-mail the app sends and shows it
  # at http://localhost:${MAILPIT_PORT}. No sign-in, so it listens on this machine only.
  mailpit:
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    profiles: [mailpit]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp] # its mailbox lives here (gone on restart)
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8035}:8025"

secrets:
  db_password: { file: "${SECRETS_DIR}/db_password" }
  db_root_password: { file: "${SECRETS_DIR}/db_root_password" }
  master_key: { file: "${SECRETS_DIR}/master_key" }
  metrics_token: { file: "${SECRETS_DIR}/metrics_token" }
  etoro_demo_pub: { file: "${SECRETS_DIR}/etoro_demo_pub" }
  etoro_demo_pk: { file: "${SECRETS_DIR}/etoro_demo_pk" }
  smtp_password: { file: "${SECRETS_DIR}/smtp_password" }
