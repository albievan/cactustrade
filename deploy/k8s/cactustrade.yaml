# cactusTrade on k3s / Kubernetes. Rendered by deploy.sh (`./deploy.sh --render --k3s` prints
# it without touching a cluster), which fills the ${…} placeholders from .env and keeps the
# lines marked "# https" or "# plain-http" for K8S_HTTPS. The Secret cactustrade-secrets (db_password, db_root_password, master_key,
# metrics_token, etoro_demo_pub, etoro_demo_pk) is created by deploy.sh. NetworkPolicies at
# the end: MariaDB only from the app, the app only from the ingress controller (PLAN 7.1.16).
apiVersion: v1
kind: Namespace
metadata:
  name: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cactustrade-config
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
data:
  TZ: "${TZ}"
  CACTUSTRADE_DB_DRIVER: mariadb
  CACTUSTRADE_DB_HOST: mariadb
  CACTUSTRADE_DB_NAME: "${MARIADB_DATABASE}"
  CACTUSTRADE_DB_USER: "${MARIADB_USER}"
  CACTUSTRADE_SECRETS_DIR: /run/secrets
  # TLS ends at the ingress controller; the pod speaks HTTP inside the cluster.
  CACTUSTRADE_TLS: "off"
  # Go's soft memory limit, under the pod's 512Mi limit (PLAN 7.1.4: at most 3 password
  # hashes of 64 MiB run at once).
  GOMEMLIMIT: "400MiB"
  CACTUSTRADE_ADDR: ":8080"
  CACTUSTRADE_LOG_LEVEL: "${CACTUSTRADE_LOG_LEVEL}"
  CACTUSTRADE_COOKIE_SECURE: "${CACTUSTRADE_COOKIE_SECURE}"
  # Who may set X-Forwarded-For: the ingress controller's pod addresses only (PLAN 7.1.16;
  # K8S_TRUSTED_PROXIES in .env, empty = nobody: every client then counts as the ingress
  # controller's address for the sign-in and API rate limits). docs/RUNBOOK.md says how to
  # find the addresses.
  CACTUSTRADE_TRUSTED_PROXIES: "${K8S_TRUSTED_PROXIES}"
  CACTUSTRADE_SMTP_TEST_MAILBOX_RESETS: "false"
  ETORO_DEMO_PUB_FILE: /run/secrets/etoro_demo_pub
  ETORO_DEMO_PK_FILE: /run/secrets/etoro_demo_pk
  CACTUSTRADE_PUBLIC_URL: "${CACTUSTRADE_PUBLIC_URL}"
  CACTUSTRADE_SMTP_HOST: "${CACTUSTRADE_SMTP_HOST}"
  CACTUSTRADE_SMTP_PORT: "${CACTUSTRADE_SMTP_PORT}"
  CACTUSTRADE_SMTP_TLS: "${CACTUSTRADE_SMTP_TLS}"
  CACTUSTRADE_SMTP_USER: "${CACTUSTRADE_SMTP_USER}"
  CACTUSTRADE_SMTP_FROM: "${CACTUSTRADE_SMTP_FROM}"
  CACTUSTRADE_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${K8S_STORAGE_CLASS}
  resources: { requests: { storage: ${K8S_MARIADB_STORAGE} } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${K8S_STORAGE_CLASS}
  resources: { requests: { storage: ${K8S_DATA_STORAGE} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/name: mariadb, app.kubernetes.io/part-of: cactustrade }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: mariadb } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mariadb, app.kubernetes.io/part-of: cactustrade }
    spec:
      # No pod talks to the Kubernetes API (and the token mount would collide with the
      # read-only /run/secrets volume).
      automountServiceAccountToken: false
      # Hardened (PLAN 7.1.16): the image's own mysql user (999) from the start, no
      # capabilities, no privilege gain, read-only root file system; only the data volume,
      # the socket folder and /tmp are writable.
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mariadb
          image: mariadb:11@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          env:
            - { name: TZ, value: "${TZ}" }
            - { name: MARIADB_DATABASE, value: "${MARIADB_DATABASE}" }
            - { name: MARIADB_USER, value: "${MARIADB_USER}" }
            - { name: MARIADB_PASSWORD_FILE, value: /run/secrets/db_password }
            - { name: MARIADB_ROOT_PASSWORD_FILE, value: /run/secrets/db_root_password }
          ports: [{ containerPort: 3306, name: mysql }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: run, mountPath: /run/mysqld }
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
          readinessProbe:
            exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: mariadb-data } }
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        - name: secrets
          secret:
            secretName: cactustrade-secrets
            items:
              - { key: db_password, path: db_password }
              - { key: db_root_password, path: db_root_password }
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
spec:
  selector: { app.kubernetes.io/name: mariadb }
  ports: [{ port: 3306, targetPort: mysql }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cactustrade
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/name: cactustrade, app.kubernetes.io/part-of: cactustrade }
spec:
  # Exactly one replica: one trading agent per eToro account.
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: cactustrade } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cactustrade, app.kubernetes.io/part-of: cactustrade }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: cactustrade
          image: ${IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          envFrom: [{ configMapRef: { name: cactustrade-config } }]
          ports: [{ containerPort: 8080, name: http }]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 60 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: data } }
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        # Only the keys the app reads (not db_root_password).
        - name: secrets
          secret:
            secretName: cactustrade-secrets
            items:
              - { key: db_password, path: db_password }
              - { key: master_key, path: master_key }
              - { key: metrics_token, path: metrics_token }
              - { key: etoro_demo_pub, path: etoro_demo_pub }
              - { key: etoro_demo_pk, path: etoro_demo_pk }
              - { key: smtp_password, path: smtp_password }
---
apiVersion: v1
kind: Service
metadata:
  name: cactustrade
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
spec:
  # K8S_HTTPS=true: reachable only through the ingress (TLS); the pod's plain HTTP never
  # leaves the cluster (PLAN 7.1.6). deploy.sh keeps the lines marked for the chosen mode.
  type: ClusterIP # https
  # K8S_HTTPS=false only: plain HTTP on every node's port (deploy.sh warns loudly). Local
  # keeps the client's address, so the sign-in rate limit counts each client.
  type: NodePort # plain-http
  externalTrafficPolicy: Local # plain-http
  selector: { app.kubernetes.io/name: cactustrade }
  ports: [{ port: 80, targetPort: http }] # https
  ports: [{ port: 80, targetPort: http, nodePort: ${K8S_NODE_PORT} }] # plain-http
---
# Network (PLAN 7.1.16). A pod selected by a NetworkPolicy takes only the traffic a policy
# allows. This needs a network plugin that enforces NetworkPolicy: k3s's built-in one does;
# on k8s check yours (Calico, Cilium, … do; plain flannel does not). Outgoing traffic is not
# limited (eToro, the LLM, the mail server and DNS are outside).
# MariaDB: port 3306 from the cactusTrade pod only. deploy.sh's backups and restores use
# `kubectl exec`, which is not network traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: mariadb } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: cactustrade } } }]
      ports: [{ protocol: TCP, port: 3306 }]
---
# cactusTrade: its HTTP port from the ingress controller's pods only (K8S_HTTPS=true;
# K8S_INGRESS_NAMESPACE and K8S_INGRESS_POD_SELECTOR in .env, k3s: Traefik in kube-system).
# In the plain-HTTP NodePort mode it is open to every client, as the Service is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cactustrade
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: cactustrade } }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ protocol: TCP, port: 8080 }]
      from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ${K8S_INGRESS_NAMESPACE} } }, podSelector: { matchLabels: { ${K8S_INGRESS_POD_LABEL} } } }] # https
