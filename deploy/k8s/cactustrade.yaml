# cactusTrade on k3s / Kubernetes. Rendered by deploy.sh, which fills the ${…} placeholders
# from .env. The Secret cactustrade-secrets (db_password, db_root_password, master_key,
# setup_token, metrics_token, etoro_demo_pub, etoro_demo_pk) is created by deploy.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cactustrade-config
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
data:
  TZ: "${TZ}"
  CACTUSTRADE_DB_DRIVER: mariadb
  CACTUSTRADE_DB_HOST: mariadb
  CACTUSTRADE_DB_NAME: "${MARIADB_DATABASE}"
  CACTUSTRADE_DB_USER: "${MARIADB_USER}"
  CACTUSTRADE_SECRETS_DIR: /run/secrets
  # TLS ends at the ingress controller; the pod speaks HTTP inside the cluster.
  CACTUSTRADE_TLS: "off"
  CACTUSTRADE_ADDR: ":8080"
  CACTUSTRADE_LOG_LEVEL: "${CACTUSTRADE_LOG_LEVEL}"
  CACTUSTRADE_COOKIE_SECURE: "${CACTUSTRADE_COOKIE_SECURE}"
  # The ingress controller's pods (k3s's default pod network) may set X-Forwarded-For.
  CACTUSTRADE_TRUSTED_PROXIES: "10.42.0.0/16"
  ETORO_DEMO_PUB_FILE: /run/secrets/etoro_demo_pub
  ETORO_DEMO_PK_FILE: /run/secrets/etoro_demo_pk
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${K8S_STORAGE_CLASS}
  resources: { requests: { storage: ${K8S_MARIADB_STORAGE} } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${K8S_STORAGE_CLASS}
  resources: { requests: { storage: ${K8S_DATA_STORAGE} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/name: mariadb, app.kubernetes.io/part-of: cactustrade }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: mariadb } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mariadb, app.kubernetes.io/part-of: cactustrade }
    spec:
      # No pod talks to the Kubernetes API (and the token mount would collide with the
      # read-only /run/secrets volume).
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: mariadb:11
          env:
            - { name: TZ, value: "${TZ}" }
            - { name: MARIADB_DATABASE, value: "${MARIADB_DATABASE}" }
            - { name: MARIADB_USER, value: "${MARIADB_USER}" }
            - { name: MARIADB_PASSWORD_FILE, value: /run/secrets/db_password }
            - { name: MARIADB_ROOT_PASSWORD_FILE, value: /run/secrets/db_root_password }
          ports: [{ containerPort: 3306, name: mysql }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
          readinessProbe:
            exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: mariadb-data } }
        - name: secrets
          secret:
            secretName: cactustrade-secrets
            items:
              - { key: db_password, path: db_password }
              - { key: db_root_password, path: db_root_password }
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
spec:
  selector: { app.kubernetes.io/name: mariadb }
  ports: [{ port: 3306, targetPort: mysql }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cactustrade
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/name: cactustrade, app.kubernetes.io/part-of: cactustrade }
spec:
  # Exactly one replica: one trading agent per eToro account.
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: cactustrade } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cactustrade, app.kubernetes.io/part-of: cactustrade }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: cactustrade
          image: ${IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          envFrom: [{ configMapRef: { name: cactustrade-config } }]
          ports: [{ containerPort: 8080, name: http }]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 60 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: data } }
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        # Only the keys the app reads (not db_root_password).
        - name: secrets
          secret:
            secretName: cactustrade-secrets
            items:
              - { key: db_password, path: db_password }
              - { key: master_key, path: master_key }
              - { key: setup_token, path: setup_token }
              - { key: metrics_token, path: metrics_token }
              - { key: etoro_demo_pub, path: etoro_demo_pub }
              - { key: etoro_demo_pk, path: etoro_demo_pk }
---
apiVersion: v1
kind: Service
metadata:
  name: cactustrade
  namespace: ${K8S_NAMESPACE}
  labels: { app.kubernetes.io/part-of: cactustrade }
spec:
  type: NodePort
  # Local keeps the client's address, so the sign-in rate limit counts each client.
  externalTrafficPolicy: Local
  selector: { app.kubernetes.io/name: cactustrade }
  ports: [{ port: 80, targetPort: http, nodePort: ${K8S_NODE_PORT} }]
